<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5fa">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d0e1a");
          }
        } catch (e) {}
      })();
    </script>
    <title>Acesso - Estimulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      .password-field {
        position: relative;
        display: flex;
      }
      .password-field input {
        width: 100%;
        padding-right: 40px;
      }
      .password-toggle {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        color: var(--text-muted);
      }
      .password-toggle:hover {
        color: var(--text);
      }
      .password-toggle svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .password-toggle svg.is-hidden {
        display: none;
      }
    </style>
  </head>
  <body class="access-page">
    <main class="access-shell">
      <section class="access-panel" aria-labelledby="accessTitle">
        <img src="assets/img/logo-mark.svg" alt="" class="access-logo">
        <div class="access-copy">
          <h1 id="accessTitle">Acesso ao painel</h1>
          <p>Entre com seu usuario e senha para continuar.</p>
        </div>

        <form id="accessForm" class="access-form">
          <div class="field">
            <label for="accessUsername">Usuario</label>
            <input id="accessUsername" name="username" type="text" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="accessPassword">Senha</label>
            <div class="password-field">
              <input id="accessPassword" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="password-toggle" data-target="accessPassword" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 4.22-5.77M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <button class="btn" type="submit" id="accessButton">Entrar</button>
          <p class="access-error" id="accessError" role="alert" hidden></p>
        </form>

        <p style="margin-top:14px;">
          <button type="button" id="toggleRegisterButton" class="btn-link" style="background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;">Criar um login novo</button>
        </p>

        <form id="registerForm" class="access-form" hidden>
          <div class="field">
            <label for="registerUsername">Novo usuario</label>
            <input id="registerUsername" name="username" type="text" autocomplete="username">
          </div>
          <div class="field">
            <label for="registerPassword">Nova senha (min. 8 caracteres)</label>
            <div class="password-field">
              <input id="registerPassword" name="password" type="password" autocomplete="new-password">
              <button type="button" class="password-toggle" data-target="registerPassword" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 4.22-5.77M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="registerMasterPassword">Senha mestra</label>
            <div class="password-field">
              <input id="registerMasterPassword" name="master_password" type="password" autocomplete="off">
              <button type="button" class="password-toggle" data-target="registerMasterPassword" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 4.22-5.77M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <button class="btn" type="submit" id="registerButton">Criar login</button>
          <p class="access-error" id="registerError" role="alert" hidden></p>
          <p class="access-error" id="registerSuccess" role="status" hidden style="color:var(--success);"></p>
        </form>
      </section>
    </main>

    <script>
      (function () {
        const form = document.getElementById("accessForm");
        const usernameInput = document.getElementById("accessUsername");
        const input = document.getElementById("accessPassword");
        const button = document.getElementById("accessButton");
        const errorEl = document.getElementById("accessError");
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/app/index.html";
        const LOCAL_API_BASE_URL = "http://127.0.0.1:3000";

        function isLocalHost(hostname) {
          return ["localhost", "127.0.0.1", "::1"].includes(hostname);
        }

        function apiUrl(path) {
          const current = window.location;
          const alreadyOnApi = current.protocol.startsWith("http") && isLocalHost(current.hostname) && current.port === "3000";
          const localStaticServer = current.protocol === "file:" || (current.protocol.startsWith("http") && isLocalHost(current.hostname));

          if (alreadyOnApi || !localStaticServer) {
            return path;
          }

          return `${LOCAL_API_BASE_URL}${path}`;
        }

        function showError(message) {
          errorEl.textContent = message;
          errorEl.hidden = false;
        }

        function goNext() {
          const current = window.location;
          const alreadyOnApi = current.protocol.startsWith("http") && isLocalHost(current.hostname) && current.port === "3000";
          const localStaticServer = current.protocol === "file:" || (current.protocol.startsWith("http") && isLocalHost(current.hostname));
          const safeNext = next.startsWith("/") ? next : "/app/index.html";

          if (!alreadyOnApi && localStaticServer) {
            window.location.href = `${LOCAL_API_BASE_URL}${safeNext}`;
            return;
          }

          window.location.href = safeNext;
        }

        async function checkStatus() {
          try {
            const response = await fetch(apiUrl("/access/status"), { cache: "no-store", credentials: "include" });
            const payload = await response.json();
            if (!payload.required || payload.authorized) goNext();
          } catch (error) {
            showError("Nao foi possivel verificar o acesso agora.");
          }
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          errorEl.hidden = true;
          button.disabled = true;
          button.textContent = "Entrando…";

          try {
            const response = await fetch(apiUrl("/access/login"), {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: usernameInput.value, password: input.value }),
            });
            const payload = await response.json().catch(() => ({}));

            if (response.status === 429) {
              throw new Error(payload.error || "Muitas tentativas. Aguarde antes de tentar novamente.");
            }

            if (!response.ok || !payload.authorized) {
              throw new Error(payload.error || "Usuario ou senha incorretos");
            }

            goNext();
          } catch (error) {
            showError(error.message || "Usuario ou senha incorretos");
            input.select();
          } finally {
            button.disabled = false;
            button.textContent = "Entrar";
          }
        });

        checkStatus();

        document.querySelectorAll(".password-toggle").forEach((toggle) => {
          const target = document.getElementById(toggle.dataset.target);
          const eyeIcon = toggle.querySelector(".icon-eye");
          const eyeOffIcon = toggle.querySelector(".icon-eye-off");

          toggle.addEventListener("click", () => {
            const willShow = target.type === "password";
            target.type = willShow ? "text" : "password";
            toggle.setAttribute("aria-pressed", String(willShow));
            toggle.setAttribute("aria-label", willShow ? "Ocultar senha" : "Mostrar senha");
            eyeIcon.classList.toggle("is-hidden", willShow);
            eyeOffIcon.classList.toggle("is-hidden", !willShow);
          });
        });

        const toggleRegisterButton = document.getElementById("toggleRegisterButton");
        const registerForm = document.getElementById("registerForm");
        const registerUsernameInput = document.getElementById("registerUsername");
        const registerPasswordInput = document.getElementById("registerPassword");
        const registerMasterPasswordInput = document.getElementById("registerMasterPassword");
        const registerButton = document.getElementById("registerButton");
        const registerErrorEl = document.getElementById("registerError");
        const registerSuccessEl = document.getElementById("registerSuccess");

        // .access-form tem "display: grid" no CSS, que tem prioridade sobre o
        // estilo padrao do atributo [hidden] ("display: none") - por isso o
        // toggle usa style.display explicitamente em vez de .hidden.
        registerForm.style.display = "none";

        toggleRegisterButton.addEventListener("click", () => {
          const showingRegister = registerForm.style.display !== "none";
          registerForm.style.display = showingRegister ? "none" : "grid";
          form.style.display = showingRegister ? "grid" : "none";
          toggleRegisterButton.textContent = showingRegister ? "Criar um login novo" : "Já tenho login, entrar";
        });

        registerForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          registerErrorEl.hidden = true;
          registerSuccessEl.hidden = true;
          registerButton.disabled = true;
          registerButton.textContent = "Criando...";

          try {
            const response = await fetch(apiUrl("/access/register"), {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: registerUsernameInput.value,
                password: registerPasswordInput.value,
                master_password: registerMasterPasswordInput.value,
              }),
            });
            const payload = await response.json().catch(() => ({}));

            if (!response.ok) {
              throw new Error(payload.error || "Nao foi possivel criar o login.");
            }

            registerSuccessEl.textContent = `Login "${payload.username}" criado. Voce ja pode entrar.`;
            registerSuccessEl.hidden = false;
            usernameInput.value = payload.username;
            registerForm.reset();
            setTimeout(() => {
              registerForm.style.display = "none";
              form.style.display = "grid";
              toggleRegisterButton.textContent = "Criar um login novo";
              input.focus();
            }, 1500);
          } catch (error) {
            registerErrorEl.textContent = error.message;
            registerErrorEl.hidden = false;
          } finally {
            registerButton.disabled = false;
            registerButton.textContent = "Criar login";
          }
        });
      })();
    </script>
  </body>
</html>
