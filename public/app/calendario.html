<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5fa">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d0e1a");
          }
        } catch (e) {}
      })();
    </script>
    <title>Calendário editorial · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      /* Fill the space below the topbar using flexbox, computed natively by the browser —
         no JS-measured pixel subtraction, so it stays correct at any OS/browser zoom level. */
      body[data-page="calendario"] .page {
        max-width: none;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }
      .cal-fill { flex: 1 1 auto; min-height: 280px; display: flex; flex-direction: column; gap: 8px; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
      #calendarGrid { flex: 1 1 auto; min-height: 0; grid-auto-rows: 1fr; }
      .cal-weekday { text-align:center; font-size: var(--fs-xs); font-weight:700; color:var(--text-faint); text-transform:uppercase; padding-bottom:4px; }
      .cal-cell {
        min-height:56px; border:1px solid var(--line); border-radius:var(--radius-md); padding:8px;
        background:var(--surface); display:flex; flex-direction:column; gap:6px; overflow:hidden; min-width:0;
      }
      .cal-cell.outside { opacity:0.35; }
      .cal-cell.today { border-color: var(--brand-blue); box-shadow: 0 0 0 2px rgba(78,121,255,0.15); }
      .cal-cell.has-items { cursor: pointer; }
      .cal-cell.has-items:hover { background: var(--surface-strong); }
      .cal-daynum { font-size: var(--fs-sm); font-weight:700; color:var(--text-muted); }
      .cal-cell-body { flex:1; display:flex; align-items:center; justify-content:center; }
      .cal-count-pill {
        display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
        background: rgba(78,121,255,0.12); color: var(--brand-blue); font-size: var(--fs-sm); font-weight:700;
        white-space: nowrap;
      }
      .cal-count-pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
      .cal-nav { display:flex; align-items:center; gap:10px; }
      .cal-nav button { border:1px solid var(--line); background:var(--surface); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size: var(--fs-md); }
      .cal-nav button:hover { background: var(--surface-strong); }

      /* Day drawer list items — lightly detailed, click through to the campaigns page */
      .day-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        text-decoration: none;
        color: inherit;
      }
      .day-item:hover { background: var(--surface-strong); border-color: var(--line-strong); }
      .day-item-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .day-item-main strong { font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .day-item-main span { font-size: var(--fs-xs); color: var(--text-faint); }
      .day-item .badge { flex: none; }

      /* Drawer header back button + panel switching */
      .drawer-header { display: flex; align-items: center; gap: 8px; }
      .drawer-header-titles { flex: 1 1 auto; min-width: 0; }
      .drawer-header-titles h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .icon-btn-back {
        border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
        width: 30px; height: 30px; cursor: pointer; font-size: var(--fs-lg); flex: none;
      }
      .icon-btn-back:hover { background: var(--surface-strong); }
      .group-row { cursor: pointer; }
      .group-row:hover { background: var(--surface-strong); }

      @media (max-width: 720px) {
        .cal-cell { min-height: 46px; padding: 6px; }
        .cal-count-pill { font-size: var(--fs-xs); padding: 3px 7px; }
      }
    </style>
  </head>
  <body data-page="calendario">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Calendário editorial</h1>
            <p>Programação dos disparos de campanhas.</p>
          </div>
          <div class="topbar-actions">
            <div class="user-chip"><span class="avatar">LC</span> Lina Chaim</div>
          </div>
        </header>

        <main class="page" id="main-content">
          <section class="page-section">
            <div class="toolbar">
              <div class="cal-nav">
                <button id="prevMonth" type="button" aria-label="Mês anterior">‹</button>
                <strong id="monthLabel" style="min-width:170px;text-align:center;"></strong>
                <button id="nextMonth" type="button" aria-label="Próximo mês">›</button>
              </div>
              <div class="field" style="min-width:200px;">
                <label for="nameFilter">Pesquisar por nome</label>
                <input id="nameFilter" type="search" placeholder="Nome da campanha…">
              </div>
              <div class="toolbar-spacer"></div>
              <span class="text-faint" style="font-size: var(--fs-sm);">Clique em um dia para ver os detalhes</span>
            </div>
          </section>

          <section class="page-section cal-fill">
            <div class="cal-grid" id="weekdaysRow"></div>
            <div class="cal-grid" id="calendarGrid"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="drawer-backdrop" id="dayDrawerBackdrop"></div>
    <aside class="drawer" id="dayDrawer" aria-hidden="true">
      <div class="drawer-header">
        <button class="icon-btn-back" id="drawerBackButton" type="button" aria-label="Voltar" hidden>‹</button>
        <div class="drawer-header-titles">
          <h3 id="dayDrawerTitle">Conteúdos do dia</h3>
        </div>
        <button class="icon-btn-close" id="closeDayDrawer" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="drawer-body" id="dayDrawerBody"></div>
    </aside>

    <script src="assets/js/dom-utils.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/tooltip.js"></script>
    <script>
      const WEEKDAYS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const MONTH_NAMES = [
        "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
        "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro",
      ];

      const today = new Date();
      const TODAY = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();

      const state = {
        campaigns: [],
        currentCampaignId: null,
        captionsByGroup: new Map(),
      };


      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || `Falha na requisicao (${response.status})`);
        }

        return payload;
      }

      function campaignName(campaign) {
        return campaign.trilha || campaign.nome || "Campanha";
      }

      function campaignStatusLabel(status) {
        if (status === "concluido") return "Concluído";
        if (status === "processada") return "Processada";
        return "Programado";
      }

      function campaignStatusBadgeClass(status) {
        if (status === "concluido") return "badge-success";
        if (status === "processada") return "badge-warning";
        return "badge-info";
      }

      function campaignStatusTip(status) {
        if (status === "concluido") return "Todos os grupos já tiveram o envio finalizado (com sucesso ou erro definitivo).";
        if (status === "processada") return "O horário programado já passou, mas nem todos os grupos têm confirmação de envio ou falha.";
        return "Aguardando o horário de disparo programado.";
      }

      function dispatchStatusLabel(status) {
        const labels = {
          pendente: "Pendente",
          processando: "Processando",
          enviado: "Enviado",
          erro: "Erro",
          falhou: "Falhou",
        };
        return labels[status] || status || "-";
      }

      function dispatchStatusTip(status) {
        const tips = {
          pendente: "Ainda não foi processado — aguardando o horário programado de disparo.",
          processando: "Envio em andamento — o vídeo está sendo enviado agora pela Evolution API.",
          enviado: "Entregue com sucesso ao grupo via Evolution API.",
          erro: "Falha no envio — motivo não informado.",
          falhou: "Falha no envio — motivo não informado.",
        };
        return tips[status] || "";
      }

      function dispatchStatusBadgeClass(status) {
        if (status === "enviado") return "badge-success";
        if (status === "erro" || status === "falhou") return "badge-danger";
        if (status === "processando") return "badge-info";
        return "badge-warning";
      }

      function captionStatusLabel(status) {
        const labels = {
          processando: "Gerando legenda…",
          gerado: "Legenda pronta",
          erro: "Erro ao gerar legenda",
        };
        return labels[status] || status || "-";
      }

      function campaignsForDate(dateStr) {
        const q = document.getElementById("nameFilter").value.trim().toLowerCase();

        return state.campaigns.filter((c) => {
          if (c.data_envio !== dateStr) return false;
          if (q && !campaignName(c).toLowerCase().includes(q)) return false;
          return true;
        });
      }

      function renderWeekdaysRow() {
        document.getElementById("weekdaysRow").innerHTML = WEEKDAYS.map((w) => `<div class="cal-weekday">${w}</div>`).join("");
      }

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      // Mesmo padrao de erro das demais telas (.empty-state com a mensagem do
      // erro), adaptado para cobrir a grade do calendario.
      function renderLoadError(error) {
        document.getElementById("calendarGrid").innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <strong>Nao foi possivel carregar as campanhas</strong>
            <p>${escapeHtml(error && error.message ? error.message : String(error))}</p>
          </div>`;
      }

      function renderCalendar() {
        document.getElementById("monthLabel").textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

        const firstOfMonth = new Date(viewYear, viewMonth, 1);
        const startWeekday = firstOfMonth.getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

        const cells = [];
        for (let i = 0; i < startWeekday; i++) {
          cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, outside: true, dateStr: null });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ day: d, outside: false, dateStr: `${viewYear}-${pad(viewMonth + 1)}-${pad(d)}` });
        }
        while (cells.length % 7 !== 0) {
          cells.push({ day: cells.length - (startWeekday + daysInMonth) + 1, outside: true, dateStr: null });
        }

        document.getElementById("calendarGrid").innerHTML = cells
          .map((cell) => {
            if (cell.outside) {
              return `<div class="cal-cell outside"><span class="cal-daynum">${cell.day}</span></div>`;
            }
            const count = campaignsForDate(cell.dateStr).length;
            return `
              <div class="cal-cell${cell.dateStr === TODAY ? " today" : ""}${count ? " has-items" : ""}" data-date="${cell.dateStr}"${count ? ` aria-label="${count} programaç${count > 1 ? "ões" : "ão"} em ${cell.day}"` : ""}>
                <span class="cal-daynum">${cell.day}</span>
                <div class="cal-cell-body">
                  ${count ? `<span class="cal-count-pill"><span class="dot"></span>${count} programaç${count > 1 ? "ões" : "ão"}</span>` : ""}
                </div>
              </div>`;
          })
          .join("");

        document.querySelectorAll(".cal-cell.has-items").forEach((el) => {
          const activate = () => openDayDrawer(el.dataset.date);
          el.addEventListener("click", activate);
          window.estimuloMakeKeyboardClickable(el, activate);
        });
      }

      // Drawer navigation stack — each entry knows how to (re-)render itself into #dayDrawerBody.
      // Views: "day" (campaigns of the clicked date) -> "campaign" (groups of a campaign) -> "group" (caption detail).
      const drawerStack = [];

      function drawerTitleEl() {
        return document.getElementById("dayDrawerTitle");
      }

      function drawerBodyEl() {
        return document.getElementById("dayDrawerBody");
      }

      function pushDrawerView(view) {
        drawerStack.push(view);
        renderDrawerTop();
      }

      function popDrawerView() {
        if (drawerStack.length <= 1) return;
        drawerStack.pop();
        renderDrawerTop();
      }

      function renderDrawerTop() {
        const view = drawerStack[drawerStack.length - 1];
        document.getElementById("drawerBackButton").hidden = drawerStack.length <= 1;
        drawerTitleEl().textContent = view.title;
        view.render();
      }

      function renderDayView(dateStr) {
        const campaigns = campaignsForDate(dateStr);

        drawerBodyEl().innerHTML = campaigns.length
          ? campaigns
              .map(
                (c) => `
              <a class="day-item" href="#" data-campaign-id="${escapeHtml(c.id)}">
                <div class="day-item-main">
                  <strong>${escapeHtml(campaignName(c))}</strong>
                  <span>${Number(c.grupos_total || 0)} grupo${Number(c.grupos_total || 0) === 1 ? "" : "s"}</span>
                </div>
                <span class="badge has-tip ${campaignStatusBadgeClass(c.status)}" data-tip="${escapeHtml(campaignStatusTip(c.status))}" data-tip-tone="${campaignStatusBadgeClass(c.status).replace("badge-", "")}">${campaignStatusLabel(c.status)}</span>
              </a>`
              )
              .join("")
          : `<div class="empty-state"><strong>Nenhuma campanha neste dia</strong></div>`;

        document.querySelectorAll("#dayDrawerBody [data-campaign-id]").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.preventDefault();
            openCampaignView(el.dataset.campaignId);
          });
        });
      }

      function openDayDrawer(dateStr) {
        drawerStack.length = 0;
        pushDrawerView({ title: `Conteúdos de ${dateStr}`, render: () => renderDayView(dateStr) });

        document.getElementById("dayDrawer").classList.add("open");
        document.getElementById("dayDrawer").setAttribute("aria-hidden", "false");
        document.getElementById("dayDrawerBackdrop").classList.add("open");
      }

      function closeDayDrawer() {
        document.getElementById("dayDrawer").classList.remove("open");
        document.getElementById("dayDrawer").setAttribute("aria-hidden", "true");
        document.getElementById("dayDrawerBackdrop").classList.remove("open");
        drawerStack.length = 0;
      }

      document.getElementById("closeDayDrawer").addEventListener("click", closeDayDrawer);
      document.getElementById("dayDrawerBackdrop").addEventListener("click", closeDayDrawer);
      document.getElementById("drawerBackButton").addEventListener("click", popDrawerView);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDayDrawer();
      });

      document.getElementById("prevMonth").addEventListener("click", () => {
        viewMonth -= 1;
        if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
        renderCalendar();
      });
      document.getElementById("nextMonth").addEventListener("click", () => {
        viewMonth += 1;
        if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
        renderCalendar();
      });
      document.getElementById("nameFilter").addEventListener("input", renderCalendar);

      function openCampaignView(campaignId) {
        const campaign = state.campaigns.find((c) => c.id === campaignId);
        pushDrawerView({
          title: campaign ? campaignName(campaign) : "Campanha",
          render: () => renderCampaignView(campaignId),
        });
      }

      async function renderCampaignView(campaignId) {
        drawerBodyEl().innerHTML = `<div class="empty-state"><strong>Carregando grupos</strong></div>`;

        try {
          const [groups, progress] = await Promise.all([
            requestJson(`/campaigns/${encodeURIComponent(campaignId)}/groups`),
            requestJson(`/campaigns/${encodeURIComponent(campaignId)}/captions/progress`).catch(() => null),
          ]);

          state.captionsByGroup = new Map();
          if (progress && Array.isArray(progress.items)) {
            progress.items.forEach((item) => {
              state.captionsByGroup.set(`${item.group_id}::${item.video_id}`, item);
            });
          }

          if (!groups.length) {
            drawerBodyEl().innerHTML = `<div class="empty-state"><strong>Nenhum grupo associado a esta campanha</strong></div>`;
            return;
          }

          drawerBodyEl().innerHTML = groups
            .map(
              (g) => `
              <a class="day-item group-row" href="#" data-group-id="${escapeHtml(g.group_id)}" data-video-id="${escapeHtml(g.video_id || "")}" data-group-name="${escapeHtml(g.nome || g.group_id)}">
                <div class="day-item-main">
                  <strong>${escapeHtml(g.nome || g.group_id)}</strong>
                  <span>${escapeHtml(g.criado_em ? new Date(g.criado_em).toLocaleString("pt-BR") : "—")}</span>
                </div>
                <span class="badge has-tip ${dispatchStatusBadgeClass(g.status)}" data-tip="${escapeHtml(dispatchStatusTip(g.status))}" data-tip-tone="${dispatchStatusBadgeClass(g.status).replace("badge-", "")}">${dispatchStatusLabel(g.status)}</span>
              </a>`
            )
            .join("");

          document.querySelectorAll("#dayDrawerBody [data-group-id]").forEach((el) => {
            el.addEventListener("click", (e) => {
              e.preventDefault();
              openGroupView(el.dataset.groupId, el.dataset.videoId, el.dataset.groupName);
            });
          });
        } catch (error) {
          drawerBodyEl().innerHTML = `<div class="empty-state"><strong>Falha ao carregar grupos</strong><span>${escapeHtml(error.message)}</span></div>`;
        }
      }

      function openGroupView(groupId, videoId, groupName) {
        pushDrawerView({
          title: `Legenda · ${groupName}`,
          render: () => renderGroupView(groupId, videoId),
        });
      }

      function renderGroupView(groupId, videoId) {
        const item = state.captionsByGroup.get(`${groupId}::${videoId}`);

        if (!videoId) {
          drawerBodyEl().innerHTML = `<div class="empty-state"><strong>Sem vídeo associado</strong><span>Este grupo ainda não possui um vídeo associado nesta campanha.</span></div>`;
          return;
        }

        if (!item) {
          drawerBodyEl().innerHTML = `<div class="empty-state"><strong>Nenhuma legenda encontrada</strong><span>Não há legenda registrada para este vídeo.</span></div>`;
          return;
        }

        const videoName = item.video_catalog && item.video_catalog.nome_do_arquivo ? item.video_catalog.nome_do_arquivo : videoId;
        const meta = `<p class="text-muted">Vídeo: ${escapeHtml(videoName)} · ${escapeHtml(captionStatusLabel(item.status))}</p>`;

        if (item.status === "gerado" && item.caption_text) {
          drawerBodyEl().innerHTML = `${meta}<p style="white-space: pre-wrap;">${escapeHtml(item.caption_text)}</p>`;
        } else if (item.status === "erro") {
          drawerBodyEl().innerHTML = `${meta}<div class="empty-state"><strong>Erro ao gerar legenda</strong><span>${escapeHtml(item.erro_mensagem || "Tente novamente mais tarde.")}</span></div>`;
        } else {
          drawerBodyEl().innerHTML = `${meta}<div class="empty-state"><strong>Legenda ainda sendo preparada</strong><span>Aguarde a conclusão do processamento.</span></div>`;
        }
      }

      async function initialize() {
        renderWeekdaysRow();

        window.estimuloShowLoading();
        let loadError = null;
        try {
          const campaigns = await requestJson("/campaigns");
          state.campaigns = Array.isArray(campaigns) ? campaigns : [];
        } catch (error) {
          // Antes isto so fazia console.error e zerava state.campaigns: a tela
          // pintava um calendario vazio e perfeito, que o usuario nao tem como
          // distinguir de "nao ha campanhas neste mes". As outras telas que
          // carregam lista ja avisam a falha; esta era a unica que mentia.
          console.error("Falha ao carregar campanhas", error);
          state.campaigns = [];
          loadError = error;
        } finally {
          window.estimuloHideLoading();
        }

        renderCalendar();

        if (loadError) {
          renderLoadError(loadError);
        }
      }

      initialize();
    </script>
  </body>
</html>
