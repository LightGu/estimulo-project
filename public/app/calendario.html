<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <title>Calendário editorial · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      /* Fill the space below the topbar using flexbox, computed natively by the browser —
         no JS-measured pixel subtraction, so it stays correct at any OS/browser zoom level. */
      body[data-page="calendario"] .page {
        max-width: none;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }
      .cal-fill { flex: 1 1 auto; min-height: 280px; display: flex; flex-direction: column; gap: 8px; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
      #calendarGrid { flex: 1 1 auto; min-height: 0; grid-auto-rows: 1fr; }
      .cal-weekday { text-align:center; font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; padding-bottom:4px; }
      .cal-cell {
        min-height:56px; border:1px solid var(--line); border-radius:var(--radius-md); padding:8px;
        background:var(--surface); display:flex; flex-direction:column; gap:6px; overflow:hidden; min-width:0;
      }
      .cal-cell.outside { opacity:0.35; }
      .cal-cell.today { border-color: var(--brand-blue); box-shadow: 0 0 0 2px rgba(78,121,255,0.15); }
      .cal-cell.has-items { cursor: pointer; }
      .cal-cell.has-items:hover { background: var(--surface-strong); }
      .cal-daynum { font-size:12px; font-weight:700; color:var(--text-muted); }
      .cal-cell-body { flex:1; display:flex; align-items:center; justify-content:center; }
      .cal-count-pill {
        display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
        background: rgba(78,121,255,0.12); color: var(--brand-blue); font-size:12px; font-weight:700;
        white-space: nowrap;
      }
      .cal-count-pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
      .cal-nav { display:flex; align-items:center; gap:10px; }
      .cal-nav button { border:1px solid var(--line); background:var(--surface); border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:14px; }
      .cal-nav button:hover { background: var(--surface-strong); }

      /* Day drawer list items — lightly detailed, click through to the campaigns page */
      .day-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        text-decoration: none;
        color: inherit;
      }
      .day-item:hover { background: var(--surface-strong); border-color: var(--line-strong); }
      .day-item-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .day-item-main strong { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .day-item-main span { font-size: 11.5px; color: var(--text-faint); }
      .day-item .badge { flex: none; }

      @media (max-width: 720px) {
        .cal-cell { min-height: 46px; padding: 6px; }
        .cal-count-pill { font-size: 11px; padding: 3px 7px; }
      }
    </style>
  </head>
  <body data-page="calendario">
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Calendário editorial</h1>
            <p>Programação dos disparos de campanhas.</p>
          </div>
          <div class="topbar-actions">
            <div class="user-chip"><span class="avatar">LC</span> Lina Chaim</div>
          </div>
        </header>

        <main class="page">
          <section class="page-section">
            <div class="toolbar">
              <div class="cal-nav">
                <button id="prevMonth" type="button">‹</button>
                <strong id="monthLabel" style="min-width:170px;text-align:center;"></strong>
                <button id="nextMonth" type="button">›</button>
              </div>
              <div class="field" style="min-width:200px;">
                <label for="nameFilter">Pesquisar por nome</label>
                <input id="nameFilter" type="search" placeholder="Nome da campanha...">
              </div>
              <div class="field" style="min-width:160px;">
                <label for="levelFilter">Nível</label>
                <select id="levelFilter">
                  <option value="todos">Todos</option>
                </select>
              </div>
              <div class="field">
                <label for="orgFilter">Organização</label>
                <select id="orgFilter">
                  <option value="todas">Todas</option>
                </select>
              </div>
              <div class="toolbar-spacer"></div>
              <span class="text-faint" style="font-size:12px;">Clique em um dia para ver os detalhes</span>
            </div>
          </section>

          <section class="page-section cal-fill">
            <div class="cal-grid" id="weekdaysRow"></div>
            <div class="cal-grid" id="calendarGrid"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="drawer-backdrop" id="dayDrawerBackdrop"></div>
    <aside class="drawer" id="dayDrawer" aria-hidden="true">
      <div class="drawer-header">
        <h3 id="dayDrawerTitle">Conteúdos do dia</h3>
        <button class="icon-btn-close" id="closeDayDrawer" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="drawer-body" id="dayDrawerBody"></div>
    </aside>

    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/helpers.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>
      const WEEKDAYS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const MONTH_NAMES = [
        "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
        "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro",
      ];
      const TODAY = "2026-07-22";

      let viewYear = 2026;
      let viewMonth = 6; // 0-indexed: 6 = Julho

      function populateOrgFilter() {
        document.getElementById("orgFilter").innerHTML =
          '<option value="todas">Todas</option>' + MOCK.organizations.map((o) => `<option value="${o.id}">${o.nome}</option>`).join("");
      }

      function populateLevelFilter() {
        document.getElementById("levelFilter").innerHTML =
          '<option value="todos">Todos</option>' + MOCK.perfis.map((p) => `<option value="${p}">${p}</option>`).join("");
      }

      function campaignMatchesOrg(campaign, orgId) {
        if (orgId === "todas") return true;
        return MOCK.groups.some((g) => g.trilha === campaign.trilha && g.organizationId === orgId);
      }

      function campaignsForDate(dateStr) {
        const orgId = document.getElementById("orgFilter").value;
        const level = document.getElementById("levelFilter").value;
        const q = document.getElementById("nameFilter").value.trim().toLowerCase();

        return MOCK.campaigns.filter((c) => {
          if (c.dataEnvio !== dateStr) return false;
          if (!campaignMatchesOrg(c, orgId)) return false;
          if (level !== "todos" && perfilForTrilha(c.trilha) !== level) return false;
          if (q && !c.nome.toLowerCase().includes(q)) return false;
          return true;
        });
      }

      function renderWeekdaysRow() {
        document.getElementById("weekdaysRow").innerHTML = WEEKDAYS.map((w) => `<div class="cal-weekday">${w}</div>`).join("");
      }

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function renderCalendar() {
        document.getElementById("monthLabel").textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

        const firstOfMonth = new Date(viewYear, viewMonth, 1);
        const startWeekday = firstOfMonth.getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

        const cells = [];
        for (let i = 0; i < startWeekday; i++) {
          cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, outside: true, dateStr: null });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ day: d, outside: false, dateStr: `${viewYear}-${pad(viewMonth + 1)}-${pad(d)}` });
        }
        while (cells.length % 7 !== 0) {
          cells.push({ day: cells.length - (startWeekday + daysInMonth) + 1, outside: true, dateStr: null });
        }

        document.getElementById("calendarGrid").innerHTML = cells
          .map((cell) => {
            if (cell.outside) {
              return `<div class="cal-cell outside"><span class="cal-daynum">${cell.day}</span></div>`;
            }
            const count = campaignsForDate(cell.dateStr).length;
            return `
              <div class="cal-cell${cell.dateStr === TODAY ? " today" : ""}${count ? " has-items" : ""}" data-date="${cell.dateStr}">
                <span class="cal-daynum">${cell.day}</span>
                <div class="cal-cell-body">
                  ${count ? `<span class="cal-count-pill"><span class="dot"></span>${count} programação${count > 1 ? "ões" : ""}</span>` : ""}
                </div>
              </div>`;
          })
          .join("");

        document.querySelectorAll(".cal-cell.has-items").forEach((el) => {
          el.addEventListener("click", () => openDayDrawer(el.dataset.date));
        });
      }

      function openDayDrawer(dateStr) {
        const campaigns = campaignsForDate(dateStr);
        document.getElementById("dayDrawerTitle").textContent = `Conteúdos de ${dateStr}`;

        document.getElementById("dayDrawerBody").innerHTML = campaigns
          .map(
            (c) => `
            <a class="day-item" href="campanhas.html">
              <div class="day-item-main">
                <strong>${c.nome}</strong>
                <span>${trilhaShortName(c.trilha)} · ${c.janelaInicio}–${c.janelaFim}</span>
              </div>
              <span class="badge ${campaignStatusBadgeClass(c.status)}">${campaignStatusLabel(c.status)}</span>
            </a>`
          )
          .join("");

        document.getElementById("dayDrawer").classList.add("open");
        document.getElementById("dayDrawer").setAttribute("aria-hidden", "false");
        document.getElementById("dayDrawerBackdrop").classList.add("open");
      }

      function closeDayDrawer() {
        document.getElementById("dayDrawer").classList.remove("open");
        document.getElementById("dayDrawer").setAttribute("aria-hidden", "true");
        document.getElementById("dayDrawerBackdrop").classList.remove("open");
      }

      document.getElementById("closeDayDrawer").addEventListener("click", closeDayDrawer);
      document.getElementById("dayDrawerBackdrop").addEventListener("click", closeDayDrawer);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDayDrawer();
      });

      document.getElementById("prevMonth").addEventListener("click", () => {
        viewMonth -= 1;
        if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
        renderCalendar();
      });
      document.getElementById("nextMonth").addEventListener("click", () => {
        viewMonth += 1;
        if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
        renderCalendar();
      });
      document.getElementById("orgFilter").addEventListener("change", renderCalendar);
      document.getElementById("levelFilter").addEventListener("change", renderCalendar);
      document.getElementById("nameFilter").addEventListener("input", renderCalendar);

      populateOrgFilter();
      populateLevelFilter();
      renderWeekdaysRow();
      renderCalendar();
    </script>
  </body>
</html>
