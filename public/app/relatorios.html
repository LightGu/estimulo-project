<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5fa">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d0e1a");
          }
        } catch (e) {}
      })();
    </script>
    <title>Relatório operacional · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      /* Com 8 colunas (Data/Hora, Horario planejado, Organizacao, Grupo,
         Campanha, Conteudo, Numero, Status) o padding/fonte padrao de tabela
         (usado tambem em grupos.html, campanhas.html etc.) nao cabe sem
         quebrar cabecalhos e datas/numeros que tem espaco de sobra para caber
         numa linha so. Reduzido so aqui, sem tocar nos tokens globais. */
      .table-compact-report th,
      .table-compact-report td {
        padding: 8px 8px;
        font-size: var(--fs-xs);
      }

      .table-compact-report th {
        white-space: nowrap;
      }

      .table-compact-report td.mono,
      .table-compact-report td.nowrap {
        white-space: nowrap;
      }
    </style>
  </head>
  <body data-page="relatorios">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Relatório operacional</h1>
            <p>Conteúdos enviados, filtráveis por período, organização e grupo.</p>
          </div>
          <div class="topbar-actions">
            <div class="user-chip"><span class="avatar">LC</span> Lina Chaim</div>
          </div>
        </header>

        <main class="page" id="main-content">
          <section class="page-section">
            <div class="toolbar">
              <div class="field">
                <label for="dataInicio">De</label>
                <input id="dataInicio" type="date">
              </div>
              <div class="field">
                <label for="dataFim">Até</label>
                <input id="dataFim" type="date">
              </div>
              <div class="field" style="min-width:200px;">
                <label for="orgFilter">Organização</label>
                <select id="orgFilter"><option value="todas">Todas</option></select>
              </div>
              <div class="field" style="min-width:200px;">
                <label for="groupFilter">Grupo</label>
                <select id="groupFilter"><option value="todos">Todos</option></select>
              </div>
              <div class="field" style="min-width:160px;">
                <label for="statusFilter">Status</label>
                <select id="statusFilter">
                  <option value="todos">Todos</option>
                  <option value="pendente">Pendente</option>
                  <option value="processando">Processando</option>
                  <option value="enviado">Enviado</option>
                  <option value="erro">Erro</option>
                  <option value="falhou">Falhou</option>
                  <option value="cancelado">Cancelado</option>
                </select>
              </div>
              <div class="toolbar-spacer"></div>
              <button class="btn btn-secondary" id="clearFiltersButton" type="button">Limpar filtros</button>
              <button class="btn" id="applyFiltersButton" type="button">Aplicar filtro</button>
              <button class="btn btn-danger" id="deleteRangeButton" type="button" hidden>Apagar registros</button>
            </div>
          </section>

          <section class="page-section">
            <div class="grid grid-cols-5" id="summaryCards"></div>
          </section>

          <section class="page-section">
            <div class="section-head">
              <h2>Conteúdos enviados <span class="badge badge-neutral" id="resultCount"></span></h2>
              <span class="text-muted" id="timezoneLabel"></span>
            </div>
            <div class="table-wrap">
              <table class="table-compact-report">
                <thead>
                  <tr>
                    <th>Data/Hora</th>
                    <th>Horário envio</th>
                    <th>Organização</th>
                    <th>Grupo</th>
                    <th>Campanha</th>
                    <th>Conteúdo</th>
                    <th>Número</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="reportBody"></tbody>
              </table>
            </div>
            <div class="actions-bar-end" style="justify-content:space-between;">
              <div class="pager" id="pagerControls" style="display:flex;align-items:center;gap:10px;">
                <button class="btn btn-secondary" id="prevPageButton" type="button">Anterior</button>
                <span class="text-muted" id="pageLabel"></span>
                <button class="btn btn-secondary" id="nextPageButton" type="button">Próxima</button>
              </div>
              <button class="btn" id="exportCsvButton" type="button">Exportar CSV</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="assets/js/dom-utils.js"></script>
    <script src="assets/js/error-messages.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/tooltip.js"></script>
    <script>
      const STATUS_LABEL = {
        pendente: "Pendente",
        processando: "Processando",
        enviado: "Enviado",
        erro: "Erro",
        falhou: "Falhou",
        cancelado: "Cancelado",
      };
      const STATUS_BADGE = {
        pendente: "badge-neutral",
        processando: "badge-warning",
        enviado: "badge-success",
        erro: "badge-danger",
        falhou: "badge-danger",
        cancelado: "badge-neutral",
      };

      function dispatchStatusPresentation(row) {
        return {
          label: STATUS_LABEL[row.status] || row.status,
          badgeClass: STATUS_BADGE[row.status] || "badge-neutral",
        };
      }

      const todayIso = new Date().toISOString().slice(0, 10);
      const PAGE_SIZE = 100;

      const state = {
        organizations: [],
        groups: [],
        logs: [],
        timezone: null,
        currentPage: 1,
      };


      // Implementacao unica em assets/js/error-messages.js (era copia
      // byte-a-byte nesta e em outras oito telas). O alias local mantem as
      // chamadas existentes desta pagina funcionando sem alteracao.
      const requestJson = (url, options) => window.estimuloRequestJson(url, options);

      function renderLoadError(error) {
        document.getElementById("summaryCards").innerHTML = "";
        document.getElementById("resultCount").textContent = "";
        document.getElementById("reportBody").innerHTML = `
          <tr><td colspan="8"><div class="empty-state"><strong>Não foi possível carregar o relatório</strong><p>${escapeHtml(window.estimuloErroEmLinha(error))}</p></div></td></tr>`;
      }

      const DISPATCH_STATUS_TIP = {
        pendente: "Ainda não foi processado — aguardando o horário programado de disparo.",
        processando: "Envio em andamento — o vídeo está sendo enviado agora pela Evolution API.",
        enviado: "A Evolution aceitou o envio e postou a mensagem no grupo.",
        cancelado: "Este envio foi cancelado e não será disparado.",
      };

      function dispatchStatusTip(row) {
        if (row.status === "erro" || row.status === "falhou") {
          return row.mensagem_erro || "Falha no envio — motivo não informado.";
        }
        return DISPATCH_STATUS_TIP[row.status] || "";
      }

      function campaignLabel(campaign) {
        if (!campaign) return "—";
        if (campaign.tipo === "pontual") return campaign.trilha || "—";
        if (!campaign.data_envio) return campaign.trilha || "—";
        const [, m, d] = campaign.data_envio.split("-");
        return `Disparo no dia ${d}/${m}`;
      }

      function formatDateTime(isoString) {
        if (!isoString) return "—";
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return "—";
        return date.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          timeZone: state.timezone || undefined,
        });
      }

      function formatDateTimeStacked(isoString) {
        if (!isoString) return "—";
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return "—";
        const options = { timeZone: state.timezone || undefined };
        const dia = date.toLocaleDateString("pt-BR", { ...options, day: "2-digit", month: "2-digit", year: "numeric" });
        const hora = date.toLocaleTimeString("pt-BR", { ...options, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        return `<div>${escapeHtml(dia)}</div><div class="text-faint" style="font-size: var(--fs-xs);">${escapeHtml(hora)}</div>`;
      }

      function populateFilters() {
        document.getElementById("orgFilter").innerHTML =
          '<option value="todas">Todas</option>' +
          state.organizations.map((o) => `<option value="${o.id}">${escapeHtml(o.nome)}</option>`).join("");

        document.getElementById("groupFilter").innerHTML =
          '<option value="todos">Todos</option>' +
          state.groups.map((g) => `<option value="${g.id}">${escapeHtml(g.nome)}</option>`).join("");
      }

      function readFiltersFromUrl() {
        const params = new URLSearchParams(window.location.search);
        document.getElementById("dataInicio").value = params.get("start_date") || "";
        document.getElementById("dataFim").value = params.get("end_date") || "";
        document.getElementById("orgFilter").value = params.get("organization_id") || "todas";
        document.getElementById("groupFilter").value = params.get("group_id") || "todos";
        document.getElementById("statusFilter").value = params.get("status") || "todos";
      }

      function writeFiltersToUrl() {
        const dataInicio = document.getElementById("dataInicio").value;
        const dataFim = document.getElementById("dataFim").value;
        const org = document.getElementById("orgFilter").value;
        const group = document.getElementById("groupFilter").value;
        const status = document.getElementById("statusFilter").value;

        const params = new URLSearchParams();
        if (dataInicio) params.set("start_date", dataInicio);
        if (dataFim) params.set("end_date", dataFim);
        if (org !== "todas") params.set("organization_id", org);
        if (group !== "todos") params.set("group_id", group);
        if (status !== "todos") params.set("status", status);

        const query = params.toString();
        const newUrl = query ? `${window.location.pathname}?${query}` : window.location.pathname;
        history.replaceState(null, "", newUrl);
      }

      function clampToToday(inputEl) {
        if (inputEl.value && inputEl.value > todayIso) {
          inputEl.value = todayIso;
        }
      }

      function formatDateOnlyPtBr(isoDateOnly) {
        const [y, m, d] = isoDateOnly.split("-");
        return `${d}/${m}/${y}`;
      }

      // Botao so aparece para quem tem is_admin=true na propria sessao - mesmo
      // padrao usado em configuracoes.html para a secao de gestao de logins.
      async function initDeleteRangeButton() {
        try {
          const response = await fetch("/access/status", { cache: "no-store" });
          const status = await response.json();
          if (status.is_admin) {
            document.getElementById("deleteRangeButton").hidden = false;
          }
        } catch (error) {
          // Sem acesso a /access/status, mantem o botao oculto por seguranca.
        }
      }

      async function fetchLogs() {
        const dataInicio = document.getElementById("dataInicio").value;
        const dataFim = document.getElementById("dataFim").value;
        const org = document.getElementById("orgFilter").value;
        const group = document.getElementById("groupFilter").value;
        const status = document.getElementById("statusFilter").value;

        const params = new URLSearchParams();
        if (dataInicio) params.set("start_date", dataInicio);
        if (dataFim) params.set("end_date", dataFim);
        if (org !== "todas") params.set("organization_id", org);
        if (group !== "todos") params.set("group_id", group);
        if (status !== "todos") params.set("status", status);

        state.logs = await requestJson(`/reports/dispatches?${params.toString()}`);
      }

      function renderSummary(rows) {
        const counts = { pendente: 0, processando: 0, enviado: 0, erro: 0, falhou: 0, cancelado: 0 };
        rows.forEach((r) => {
          if (counts[r.status] !== undefined) counts[r.status]++;
        });
        const cards = [
          { label: "Total no período", value: rows.length, bar: "var(--brand-blue)" },
          { label: "Enviados", value: counts.enviado, bar: "var(--success)" },
          { label: "Aguardando envio", value: counts.pendente + counts.processando, bar: "var(--warning)" },
          { label: "Erros", value: counts.erro + counts.falhou, bar: "var(--danger)" },
          { label: "Cancelados", value: counts.cancelado, bar: "var(--text-muted)" },
        ];
        document.getElementById("summaryCards").innerHTML = cards
          .map(
            (c) => `
            <div class="card stat-card" style="--accent-bar:${c.bar}">
              <span class="stat-label">${c.label}</span>
              <span class="stat-value">${c.value}</span>
            </div>`
          )
          .join("");
      }

      function totalPages(rows) {
        return Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      }

      function renderPager(rows) {
        const pages = totalPages(rows);
        if (state.currentPage > pages) state.currentPage = pages;
        document.getElementById("pageLabel").textContent = `Página ${state.currentPage} de ${pages}`;
        document.getElementById("prevPageButton").disabled = state.currentPage <= 1;
        document.getElementById("nextPageButton").disabled = state.currentPage >= pages;
        document.getElementById("pagerControls").style.display = rows.length > PAGE_SIZE ? "flex" : "none";
      }

      function renderTable(rows) {
        document.getElementById("resultCount").textContent = `${rows.length} registro(s)`;
        renderPager(rows);
        if (!rows.length) {
          document.getElementById("reportBody").innerHTML = `<tr><td colspan="8"><div class="empty-state"><strong>Nenhum registro encontrado para os filtros aplicados</strong></div></td></tr>`;
          return;
        }
        const start = (state.currentPage - 1) * PAGE_SIZE;
        const pageRows = rows.slice(start, start + PAGE_SIZE);
        document.getElementById("reportBody").innerHTML = pageRows
          .map((r) => {
            const organizacao = r.groups?.organizations?.nome || "—";
            const grupo = r.groups?.nome || "—";
            const campanha = campaignLabel(r.campaigns);
            const conteudo = r.video_catalog?.nome_do_arquivo || "—";
            const numero = r.whatsapp_instances?.instance_name || r.whatsapp_instances?.phone_number || "—";
            const { label: statusLabel, badgeClass } = dispatchStatusPresentation(r);
            return `
            <tr>
              <td class="mono">${formatDateTimeStacked(r.criado_em)}</td>
              <td class="mono">${formatDateTimeStacked(r.horario_envio_planejado)}</td>
              <td class="nowrap">${escapeHtml(organizacao)}</td>
              <td class="strong">${escapeHtml(grupo)}</td>
              <td>${escapeHtml(campanha)}</td>
              <td>${escapeHtml(conteudo)}</td>
              <td class="mono">${escapeHtml(numero)}</td>
              <td><span class="badge has-tip ${badgeClass}" data-tip="${escapeHtml(dispatchStatusTip(r))}" data-tip-tone="${badgeClass.replace("badge-", "")}">${statusLabel}</span></td>
            </tr>`;
          })
          .join("");
      }

      async function renderAll({ resetPage = false } = {}) {
        if (resetPage) state.currentPage = 1;
        writeFiltersToUrl();
        try {
          await fetchLogs();
          renderSummary(state.logs);
          renderTable(state.logs);
        } catch (error) {
          renderLoadError(error);
        }
      }

      ["dataInicio", "dataFim"].forEach((id) =>
        document.getElementById(id).addEventListener("change", () => {
          clampToToday(document.getElementById(id));
        })
      );

      document.getElementById("applyFiltersButton").addEventListener("click", () => renderAll({ resetPage: true }));

      document.getElementById("clearFiltersButton").addEventListener("click", () => {
        document.getElementById("dataInicio").value = "";
        document.getElementById("dataFim").value = "";
        document.getElementById("orgFilter").value = "todas";
        document.getElementById("groupFilter").value = "todos";
        document.getElementById("statusFilter").value = "todos";
        renderAll({ resetPage: true });
      });

      // "Apagar registros": nunca remove do banco (ver report.controller.js
      // hideDispatches) - so retira do relatorio os logs criados_em dentro do
      // periodo escolhido, e junto qualquer campanha que fique sem nenhum log
      // visivel restante. Reaproveita os campos de data ja usados no filtro.
      document.getElementById("deleteRangeButton").addEventListener("click", async () => {
        const dataInicio = document.getElementById("dataInicio").value;
        const dataFim = document.getElementById("dataFim").value;

        if (!dataInicio || !dataFim) {
          window.estimuloAlert("Selecione o período (De/Até) que deseja apagar antes de continuar.", {
            title: "Período obrigatório",
          });
          return;
        }

        if (dataInicio > dataFim) {
          window.estimuloAlert("A data inicial não pode ser depois da data final.", { title: "Período inválido" });
          return;
        }

        const confirmed = await window.estimuloConfirm(
          `Apagar todos os registros do relatório entre ${formatDateOnlyPtBr(dataInicio)} e ${formatDateOnlyPtBr(dataFim)}? ` +
            "Os registros somem do relatório, mas continuam guardados no banco de dados.",
          { title: "Apagar registros do período", confirmLabel: "Apagar" }
        );

        if (!confirmed) return;

        window.estimuloShowLoading();
        try {
          const params = new URLSearchParams({ start_date: dataInicio, end_date: dataFim });
          const result = await requestJson(`/reports/dispatches?${params.toString()}`, { method: "DELETE" });
          window.estimuloToast(
            `${result.hidden_logs_count} registro(s) apagado(s) do relatório.` +
              (result.hidden_campaigns_count ? ` ${result.hidden_campaigns_count} campanha(s) também removida(s) da listagem.` : ""),
            { tone: "success" }
          );
          await renderAll({ resetPage: true });
        } catch (error) {
          window.estimuloTratarErro(error, {
            alertOptions: { title: "Não foi possível apagar os registros" },
          });
        } finally {
          window.estimuloHideLoading();
        }
      });

      document.getElementById("prevPageButton").addEventListener("click", () => {
        if (state.currentPage > 1) {
          state.currentPage--;
          renderTable(state.logs);
        }
      });

      document.getElementById("nextPageButton").addEventListener("click", () => {
        if (state.currentPage < totalPages(state.logs)) {
          state.currentPage++;
          renderTable(state.logs);
        }
      });

      function toCsvValue(value) {
        const str = String(value ?? "");
        return /[",\n;]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
      }

      document.getElementById("exportCsvButton").addEventListener("click", () => {
        const headers = [
          "Data/Hora",
          "Horário envio",
          "Organização",
          "Grupo",
          "Campanha",
          "Conteúdo",
          "Número",
          "Status",
          "ID da mensagem no provedor",
        ];
        const lines = [headers.join(";")].concat(
          state.logs.map((r) =>
            [
              formatDateTime(r.criado_em),
              formatDateTime(r.horario_envio_planejado),
              r.groups?.organizations?.nome || "",
              r.groups?.nome || "",
              campaignLabel(r.campaigns),
              r.video_catalog?.nome_do_arquivo || "",
              r.whatsapp_instances?.instance_name || r.whatsapp_instances?.phone_number || "",
              dispatchStatusPresentation(r).label,
              r.provider_message_id || "",
            ]
              .map(toCsvValue)
              .join(";")
          )
        );
        const csv = "﻿" + lines.join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `relatorio-estimulo-${todayIso}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      function updateTimezoneLabel() {
        const label = document.getElementById("timezoneLabel");
        if (label) {
          label.textContent = state.timezone ? `Fuso horário: ${state.timezone}` : "";
        }
      }

      async function initialize() {
        document.getElementById("dataInicio").max = todayIso;
        document.getElementById("dataFim").max = todayIso;

        window.estimuloShowLoading();
        try {
          const [organizations, groups, scheduleSettings] = await Promise.all([
            requestJson("/organizations"),
            requestJson("/groups/search"),
            requestJson("/settings/schedule").catch(() => null),
          ]);
          state.organizations = Array.isArray(organizations) ? organizations : [];
          state.groups = Array.isArray(groups) ? groups : [];
          state.timezone = (scheduleSettings && scheduleSettings.timezone) || null;
          updateTimezoneLabel();
          populateFilters();
          readFiltersFromUrl();
          await renderAll();
          await initDeleteRangeButton();
        } catch (error) {
          renderLoadError(error);
        } finally {
          window.estimuloHideLoading();
        }
      }

      initialize();
    </script>
  </body>
</html>
