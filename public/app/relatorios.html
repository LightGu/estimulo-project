<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <title>Relatório operacional · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
  </head>
  <body data-page="relatorios">
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Relatório operacional</h1>
            <p>Conteúdos enviados, filtráveis por período, organização e grupo.</p>
          </div>
          <div class="topbar-actions">
            <div class="user-chip"><span class="avatar">LC</span> Lina Chaim</div>
          </div>
        </header>

        <main class="page">
          <section class="page-section">
            <div class="toolbar">
              <div class="field">
                <label for="dataInicio">De</label>
                <input id="dataInicio" type="date">
              </div>
              <div class="field">
                <label for="dataFim">Até</label>
                <input id="dataFim" type="date">
              </div>
              <div class="field" style="min-width:200px;">
                <label for="orgFilter">Organização</label>
                <select id="orgFilter"><option value="todas">Todas</option></select>
              </div>
              <div class="field" style="min-width:200px;">
                <label for="groupFilter">Grupo</label>
                <select id="groupFilter"><option value="todos">Todos</option></select>
              </div>
              <div class="field" style="min-width:160px;">
                <label for="statusFilter">Status</label>
                <select id="statusFilter">
                  <option value="todos">Todos</option>
                  <option value="pendente">Pendente</option>
                  <option value="processando">Processando</option>
                  <option value="enviado">Enviado</option>
                  <option value="erro">Erro</option>
                  <option value="falhou">Falhou</option>
                </select>
              </div>
              <div class="toolbar-spacer"></div>
              <button class="btn btn-secondary" id="clearFiltersButton" type="button">Limpar filtros</button>
              <button class="btn" id="applyFiltersButton" type="button">Aplicar filtro</button>
            </div>
          </section>

          <section class="page-section">
            <div class="grid grid-cols-4" id="summaryCards"></div>
          </section>

          <section class="page-section">
            <div class="section-head">
              <h2>Conteúdos enviados <span class="badge badge-neutral" id="resultCount"></span></h2>
              <span class="text-muted" id="timezoneLabel"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Data/Hora</th>
                    <th>Horário de envio planejado</th>
                    <th>Organização</th>
                    <th>Grupo</th>
                    <th>Campanha</th>
                    <th>Conteúdo</th>
                    <th>Status</th>
                    <th>Confirmação</th>
                  </tr>
                </thead>
                <tbody id="reportBody"></tbody>
              </table>
            </div>
            <div class="actions-bar-end">
              <button class="btn" id="exportCsvButton" type="button">Exportar CSV</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="assets/js/nav.js"></script>
    <script src="assets/js/tooltip.js"></script>
    <script>
      const STATUS_LABEL = {
        pendente: "Pendente",
        processando: "Processando",
        enviado: "Enviado",
        erro: "Erro",
        falhou: "Falhou",
      };
      const STATUS_BADGE = {
        pendente: "badge-neutral",
        processando: "badge-warning",
        enviado: "badge-success",
        erro: "badge-danger",
        falhou: "badge-danger",
      };

      // ACKs do WhatsApp que comprovam entrega. Espelham CONFIRMED_ACK_STATUSES
      // em src/services/delivery-confirmation.js.
      const ACK_CONFIRMADO = ["SERVER_ACK", "DELIVERY_ACK", "READ", "PLAYED"];
      // Espelham as constantes de mesmo nome em delivery-confirmation.js.
      const ACK_SEM_ACK_DE_GRUPO = "SEM_ACK_DE_GRUPO";
      const ACK_NAO_VERIFICADO = "NAO_VERIFICADO";

      function providerStatus(row) {
        return String(row.provider_status || "").toUpperCase();
      }

      function isEntregaConfirmada(row) {
        return ACK_CONFIRMADO.includes(providerStatus(row));
      }

      // Status e confirmacao respondem perguntas diferentes e por isso viram duas
      // colunas: "o envio saiu?" e "alguem confirmou o recebimento?". Enquanto as
      // duas dividiam uma celula, "enviado sem ACK" tinha de ser pintado como
      // entrega ou como problema — e o WhatsApp nao devolve ACK de mensagem que a
      // gente manda em grupo, ou seja, era a coluna inteira dizendo o que nao
      // sabia.
      function dispatchStatusPresentation(row) {
        return {
          label: STATUS_LABEL[row.status] || row.status,
          badgeClass: STATUS_BADGE[row.status] || "badge-neutral",
        };
      }

      function dispatchConfirmationPresentation(row) {
        if (row.status !== "enviado") {
          return { label: "—", badgeClass: null, tip: "" };
        }

        if (isEntregaConfirmada(row)) {
          return {
            label: "Confirmado",
            badgeClass: "badge-success",
            tip: "O WhatsApp confirmou o recebimento desta mensagem.",
          };
        }

        if (providerStatus(row) === ACK_SEM_ACK_DE_GRUPO) {
          return {
            label: "Sem ACK (grupo)",
            badgeClass: "badge-neutral",
            tip:
              "Normal em grupo: o WhatsApp não devolve confirmação por mensagem enviada a grupo. " +
              "A Evolution aceitou o envio e a mídia subiu — só não existe ACK para conferir.",
          };
        }

        if (providerStatus(row) === ACK_NAO_VERIFICADO) {
          return {
            label: "Não verificado",
            badgeClass: "badge-warning",
            tip:
              "Não foi possível consultar a confirmação (banco da Evolution inacessível ou confirmação desligada). " +
              "O envio foi aceito, mas ninguém checou o ACK.",
          };
        }

        return {
          label: "Aguardando ACK",
          badgeClass: "badge-warning",
          tip: "O envio foi aceito e o WhatsApp ainda não confirmou o recebimento.",
        };
      }

      const todayIso = new Date().toISOString().slice(0, 10);

      const state = {
        organizations: [],
        groups: [],
        logs: [],
        timezone: null,
      };

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || `Falha na requisicao (${response.status})`);
        }

        return payload;
      }

      function renderLoadError(error) {
        document.getElementById("summaryCards").innerHTML = "";
        document.getElementById("resultCount").textContent = "";
        document.getElementById("reportBody").innerHTML = `
          <tr><td colspan="8"><div class="empty-state"><strong>Não foi possível carregar o relatório</strong><p>${escapeHtml(error.message)}</p></div></td></tr>`;
      }

      const DISPATCH_STATUS_TIP = {
        pendente: "Ainda não foi processado — aguardando o horário programado de disparo.",
        processando: "Envio em andamento — o vídeo está sendo enviado agora pela Evolution API.",
        enviado: "A Evolution aceitou o envio e postou a mensagem no grupo.",
      };

      function dispatchStatusTip(row) {
        if (row.status === "erro" || row.status === "falhou") {
          return row.mensagem_erro || "Falha no envio — motivo não informado.";
        }
        return DISPATCH_STATUS_TIP[row.status] || "";
      }

      // A evidência crua (id da mensagem, estado no provedor) fica no selo de
      // confirmação, que é onde ela responde alguma pergunta.
      function dispatchConfirmationTip(row) {
        const { tip } = dispatchConfirmationPresentation(row);
        const evidencia = [
          row.provider_status ? `estado no provedor: ${row.provider_status}` : null,
          row.provider_message_id ? `id da mensagem: ${row.provider_message_id}` : null,
        ].filter(Boolean);
        return [tip, ...evidencia].filter(Boolean).join(" · ");
      }

      function campaignLabel(campaign) {
        if (!campaign) return "—";
        if (campaign.tipo === "pontual") return campaign.trilha || "—";
        if (!campaign.data_envio) return campaign.trilha || "—";
        const [, m, d] = campaign.data_envio.split("-");
        return `Disparo no dia ${d}/${m}`;
      }

      function formatDateTime(isoString) {
        if (!isoString) return "—";
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return "—";
        return date.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          timeZone: state.timezone || undefined,
        });
      }

      function populateFilters() {
        document.getElementById("orgFilter").innerHTML =
          '<option value="todas">Todas</option>' +
          state.organizations.map((o) => `<option value="${o.id}">${escapeHtml(o.nome)}</option>`).join("");

        document.getElementById("groupFilter").innerHTML =
          '<option value="todos">Todos</option>' +
          state.groups.map((g) => `<option value="${g.id}">${escapeHtml(g.nome)}</option>`).join("");
      }

      function clampToToday(inputEl) {
        if (inputEl.value && inputEl.value > todayIso) {
          inputEl.value = todayIso;
        }
      }

      async function fetchLogs() {
        const dataInicio = document.getElementById("dataInicio").value;
        const dataFim = document.getElementById("dataFim").value;
        const org = document.getElementById("orgFilter").value;
        const group = document.getElementById("groupFilter").value;
        const status = document.getElementById("statusFilter").value;

        const params = new URLSearchParams();
        if (dataInicio) params.set("start_date", dataInicio);
        if (dataFim) params.set("end_date", dataFim);
        if (org !== "todas") params.set("organization_id", org);
        if (group !== "todos") params.set("group_id", group);
        if (status !== "todos") params.set("status", status);

        state.logs = await requestJson(`/reports/dispatches?${params.toString()}`);
      }

      function renderSummary(rows) {
        const counts = { pendente: 0, processando: 0, enviado: 0, erro: 0, falhou: 0 };
        rows.forEach((r) => {
          if (counts[r.status] !== undefined) counts[r.status]++;
        });
        const cards = [
          { label: "Total no período", value: rows.length, bar: "var(--brand-blue)" },
          { label: "Enviados", value: counts.enviado, bar: "var(--success)" },
          { label: "Aguardando envio", value: counts.pendente + counts.processando, bar: "var(--warning)" },
          { label: "Erros", value: counts.erro + counts.falhou, bar: "var(--danger)" },
        ];
        document.getElementById("summaryCards").innerHTML = cards
          .map(
            (c) => `
            <div class="card stat-card" style="--accent-bar:${c.bar}">
              <span class="stat-label">${c.label}</span>
              <span class="stat-value">${c.value}</span>
            </div>`
          )
          .join("");
      }

      function renderTable(rows) {
        document.getElementById("resultCount").textContent = `${rows.length} registro(s)`;
        if (!rows.length) {
          document.getElementById("reportBody").innerHTML = `<tr><td colspan="8"><div class="empty-state"><strong>Nenhum registro encontrado para os filtros aplicados</strong></div></td></tr>`;
          return;
        }
        document.getElementById("reportBody").innerHTML = rows
          .map((r) => {
            const organizacao = r.groups?.organizations?.nome || "—";
            const grupo = r.groups?.nome || "—";
            const campanha = campaignLabel(r.campaigns);
            const conteudo = r.video_catalog?.nome_do_arquivo || "—";
            const { label: statusLabel, badgeClass } = dispatchStatusPresentation(r);
            const confirmacao = dispatchConfirmationPresentation(r);
            const confirmacaoCell = confirmacao.badgeClass
              ? `<span class="badge has-tip ${confirmacao.badgeClass}" data-tip="${escapeHtml(dispatchConfirmationTip(r))}" data-tip-tone="${confirmacao.badgeClass.replace("badge-", "")}">${confirmacao.label}</span>`
              : `<span class="text-muted">${confirmacao.label}</span>`;
            return `
            <tr>
              <td class="mono">${formatDateTime(r.criado_em)}</td>
              <td class="mono">${formatDateTime(r.horario_envio_planejado)}</td>
              <td>${escapeHtml(organizacao)}</td>
              <td class="strong">${escapeHtml(grupo)}</td>
              <td>${escapeHtml(campanha)}</td>
              <td>${escapeHtml(conteudo)}</td>
              <td><span class="badge has-tip ${badgeClass}" data-tip="${escapeHtml(dispatchStatusTip(r))}" data-tip-tone="${badgeClass.replace("badge-", "")}">${statusLabel}</span></td>
              <td>${confirmacaoCell}</td>
            </tr>`;
          })
          .join("");
      }

      async function renderAll() {
        try {
          await fetchLogs();
          renderSummary(state.logs);
          renderTable(state.logs);
        } catch (error) {
          renderLoadError(error);
        }
      }

      ["dataInicio", "dataFim"].forEach((id) =>
        document.getElementById(id).addEventListener("change", () => {
          clampToToday(document.getElementById(id));
        })
      );

      document.getElementById("applyFiltersButton").addEventListener("click", renderAll);

      document.getElementById("clearFiltersButton").addEventListener("click", () => {
        document.getElementById("dataInicio").value = "";
        document.getElementById("dataFim").value = "";
        document.getElementById("orgFilter").value = "todas";
        document.getElementById("groupFilter").value = "todos";
        document.getElementById("statusFilter").value = "todos";
        renderAll();
      });

      function toCsvValue(value) {
        const str = String(value ?? "");
        return /[",\n;]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
      }

      document.getElementById("exportCsvButton").addEventListener("click", () => {
        const headers = [
          "Data/Hora",
          "Horário de envio planejado",
          "Organização",
          "Grupo",
          "Campanha",
          "Conteúdo",
          "Status",
          "Confirmação",
          "Estado no provedor",
          "ID da mensagem no provedor",
        ];
        const lines = [headers.join(";")].concat(
          state.logs.map((r) =>
            [
              formatDateTime(r.criado_em),
              formatDateTime(r.horario_envio_planejado),
              r.groups?.organizations?.nome || "",
              r.groups?.nome || "",
              campaignLabel(r.campaigns),
              r.video_catalog?.nome_do_arquivo || "",
              dispatchStatusPresentation(r).label,
              dispatchConfirmationPresentation(r).label,
              r.provider_status || "",
              r.provider_message_id || "",
            ]
              .map(toCsvValue)
              .join(";")
          )
        );
        const csv = "﻿" + lines.join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `relatorio-estimulo-${todayIso}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      function updateTimezoneLabel() {
        const label = document.getElementById("timezoneLabel");
        if (label) {
          label.textContent = state.timezone ? `Fuso horário: ${state.timezone}` : "";
        }
      }

      async function initialize() {
        document.getElementById("dataInicio").max = todayIso;
        document.getElementById("dataFim").max = todayIso;

        try {
          const [organizations, groups, scheduleSettings] = await Promise.all([
            requestJson("/organizations"),
            requestJson("/groups/search"),
            requestJson("/settings/schedule").catch(() => null),
          ]);
          state.organizations = Array.isArray(organizations) ? organizations : [];
          state.groups = Array.isArray(groups) ? groups : [];
          state.timezone = (scheduleSettings && scheduleSettings.timezone) || null;
          updateTimezoneLabel();
          populateFilters();
          await renderAll();
        } catch (error) {
          renderLoadError(error);
        }
      }

      initialize();
    </script>
  </body>
</html>
