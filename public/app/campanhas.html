<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5fa">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d0e1a");
          }
        } catch (e) {}
      })();
    </script>
    <title>Campanhas · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      tr.campaign-row { cursor: pointer; }
      tr.campaign-row:hover { background: var(--surface-strong); }
      tr.group-row { cursor: pointer; }
      tr.group-row:hover { background: var(--surface-strong); }
      .modal-wide { width: min(920px, calc(100% - 32px)); }
      /* min-width:0, quebra de cabecalho e overflow-wrap agora sao padrao global
         (components.css). Aqui resta so a opcao por colunas de largura igual. */
      table.table-fluid { table-layout: fixed; }

    </style>
  </head>
  <body data-page="campanhas">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Campanhas</h1>
            <p>Acompanhamento das campanhas de envio automatizado.</p>
          </div>
          <div class="topbar-actions">
            <div class="user-chip"><span class="avatar">LC</span> Lina Chaim</div>
          </div>
        </header>

        <main class="page" id="main-content">
          <section class="page-section">
            <div class="section-head"><h2>Campanhas</h2></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Campanha</th>
                    <th>Quantidade de grupos</th>
                    <th>Status</th>
                    <th>
                      <span style="display: inline-flex; align-items: center; gap: 6px;">
                        Período de envio
                        <button
                          class="btn-icon btn-secondary"
                          id="campaignSortToggle"
                          type="button"
                          aria-label="Ordenar por data crescente"
                        >&#8593;</button>
                      </span>
                    </th>
                  </tr>
                </thead>
                <tbody id="campaignsBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="overlay" id="campaignDetailOverlay" hidden>
      <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="campaignDetailTitle">
        <div class="modal-header">
          <h3 id="campaignDetailTitle">Campanha</h3>
          <button class="icon-btn-close" id="closeCampaignDetail" type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <div class="table-wrap table-wrap--fluid">
            <table class="table-fluid">
              <thead id="campaignGroupsHead">
                <tr>
                  <th>Grupo</th>
                  <th id="campaignGroupsVideoHeader">Vídeo</th>
                  <th>Status</th>
                  <th>Atualizado em</th>
                </tr>
              </thead>
              <tbody id="campaignGroupsBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <div id="campaignDetailActions" style="display: flex; gap: 8px; margin-right: auto;"></div>
          <button class="btn btn-secondary" id="closeCampaignDetailFooter" type="button">Fechar</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="groupCaptionOverlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="groupCaptionTitle">
        <div class="modal-header">
          <h3 id="groupCaptionTitle">Legenda do vídeo</h3>
          <button class="icon-btn-close" id="closeGroupCaptionModal" type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <p class="text-muted" id="groupCaptionMeta"></p>
          <div id="groupCaptionContent"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="closeGroupCaptionModalFooter" type="button">Fechar</button>
        </div>
      </div>
    </div>

    <div id="toastContainer" aria-live="polite"></div>

    <script src="assets/js/dom-utils.js"></script>
    <script src="assets/js/error-messages.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/tooltip.js"></script>
    <script>
      const state = {
        campaigns: [],
        currentCampaignId: null,
        captionsByGroup: new Map(),
        sortDirection: localStorage.getItem("estimulo-campanhas-sort") === "desc" ? "desc" : "asc",
      };


      // Caixinha na propria tela em vez de window.alert(): some sozinha depois
      // de um tempo, mas tambem pode ser fechada na hora.


      // Implementacao unica em assets/js/error-messages.js (era copia
      // byte-a-byte nesta e em outras oito telas). O alias local mantem as
      // chamadas existentes desta pagina funcionando sem alteracao.
      const requestJson = (url, options) => window.estimuloRequestJson(url, options);

      function campaignName(campaign) {
        return campaign.trilha || campaign.nome || "Campanha";
      }

      function statusLabel(status) {
        if (status === "concluido") return "Concluído";
        if (status === "processada") return "Processada";
        if (status === "pausado") return "Pausado";
        if (status === "cancelado") return "Cancelado";
        if (status === "gerando_legendas") return "Gerando legendas";
        return "Programado";
      }

      function statusBadgeClass(status) {
        if (status === "concluido") return "badge-success";
        if (status === "processada") return "badge-warning";
        if (status === "pausado") return "badge-warning";
        if (status === "cancelado") return "badge-danger";
        return "badge-info";
      }

      function statusTip(status) {
        if (status === "concluido") return "Todos os grupos já tiveram o envio finalizado (com sucesso ou erro definitivo).";
        if (status === "processada") return "O horário programado já passou, mas nem todos os grupos têm confirmação de envio ou falha.";
        if (status === "pausado") return "Envio pausado pelo usuário — os disparos pendentes não saem até a campanha ser retomada.";
        if (status === "cancelado") return "Campanha cancelada — os disparos que ainda não saíram foram cancelados definitivamente.";
        if (status === "gerando_legendas") return "Gerando/revisando legendas antes de confirmar o envio.";
        return "Aguardando o horário de disparo programado.";
      }

      function dispatchStatusLabel(status) {
        const labels = {
          pendente: "Pendente",
          processando: "Processando",
          enviado: "Enviado",
          erro: "Erro",
          falhou: "Falhou",
          cancelado: "Cancelado",
          pausado: "Pausado",
        };
        return labels[status] || status || "-";
      }

      function dispatchStatusTip(status) {
        const tips = {
          pendente: "Ainda não foi processado — aguardando o horário programado de disparo.",
          processando: "Envio em andamento — o vídeo está sendo enviado agora pela Evolution API.",
          enviado: "Entregue com sucesso ao grupo via Evolution API.",
          erro: "Falha no envio — motivo não informado.",
          falhou: "Falha no envio — motivo não informado.",
          cancelado: "Envio cancelado — a campanha foi cancelada antes deste grupo ser processado.",
          pausado: "Envio congelado — a campanha está pausada; retome para liberar este disparo.",
        };
        return tips[status] || "";
      }

      function dispatchStatusBadgeClass(status) {
        if (status === "enviado") return "badge-success";
        if (status === "erro" || status === "falhou" || status === "cancelado") return "badge-danger";
        if (status === "processando") return "badge-info";
        if (status === "pausado") return "badge-warning";
        return "badge-warning";
      }

      function formatDispatchDateTime(value) {
        if (!value) return null;
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return null;
        return date.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      function dispatchPeriodLabel(campaign) {
        const start = formatDispatchDateTime(campaign.window_start);
        const end = formatDispatchDateTime(campaign.window_end);

        if (!start && !end) return "—";
        if (start && end) return `${start} – ${end}`;
        return start || end;
      }

      // Chave de ordenacao: window_start cobre data + horario juntos. Campanha
      // ainda sem janela definida (gerando_legendas) cai sempre no fim, nas duas
      // direcoes, em vez de se misturar com datas reais.
      function campaignSortTimestamp(campaign) {
        const value = campaign.window_start || (campaign.data_envio && campaign.horario_envio
          ? `${campaign.data_envio}T${campaign.horario_envio}`
          : campaign.data_envio);

        if (!value) return null;

        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date.getTime();
      }

      function sortedCampaigns() {
        const direction = state.sortDirection === "desc" ? -1 : 1;

        return [...state.campaigns].sort((left, right) => {
          const leftTs = campaignSortTimestamp(left);
          const rightTs = campaignSortTimestamp(right);

          if (leftTs === null && rightTs === null) return 0;
          if (leftTs === null) return 1;
          if (rightTs === null) return -1;

          return (leftTs - rightTs) * direction;
        });
      }

      function captionStatusLabel(status) {
        const labels = {
          processando: "Gerando legenda…",
          gerado: "Legenda pronta",
          erro: "Erro ao gerar legenda",
        };
        return labels[status] || status || "-";
      }

      function renderCampaigns() {
        if (!state.campaigns.length) {
          document.getElementById("campaignsBody").innerHTML = `
            <tr><td colspan="4"><div class="empty-state"><strong>Nenhuma campanha encontrada</strong><span>As campanhas aparecem aqui assim que um envio automatizado for disparado.</span></div></td></tr>`;
          return;
        }

        document.getElementById("campaignsBody").innerHTML = sortedCampaigns()
          .map(
            (c) => `
              <tr class="campaign-row" data-campaign-id="${escapeHtml(c.id)}" aria-label="Ver detalhes de ${escapeHtml(campaignName(c))}">
                <td class="strong">${escapeHtml(campaignName(c))}</td>
                <td>${Number(c.grupos_total || 0)}</td>
                <td><span class="badge ${statusBadgeClass(c.status)}">${statusLabel(c.status)}</span></td>
                <td class="mono">${escapeHtml(dispatchPeriodLabel(c))}</td>
              </tr>`
          )
          .join("");

        document.querySelectorAll("[data-campaign-id]").forEach((row) => {
          const activate = () => openCampaignDetail(row.dataset.campaignId);
          row.addEventListener("click", activate);
          window.estimuloMakeKeyboardClickable(row, activate);
        });
      }

      function renderLoadError(error) {
        document.getElementById("campaignsBody").innerHTML = `
          <tr><td colspan="4"><div class="empty-state"><strong>Falha ao carregar campanhas</strong><span>${escapeHtml(window.estimuloErroEmLinha(error))}</span></div></td></tr>`;
      }

      const campaignDetailOverlay = document.getElementById("campaignDetailOverlay");
      let campaignDetailReleaseTrap = null;

      function closeCampaignDetail() {
        campaignDetailOverlay.hidden = true;
        if (campaignDetailReleaseTrap) {
          campaignDetailReleaseTrap();
          campaignDetailReleaseTrap = null;
        }
      }

      function isTextCampaign(campaign) {
        return Boolean(campaign && campaign.tipo === "pontual");
      }

      async function reloadCampaignsList() {
        try {
          const campaigns = await requestJson("/campaigns");
          state.campaigns = Array.isArray(campaigns) ? campaigns : [];
          renderCampaigns();
        } catch (error) {
          renderLoadError(error);
        }
      }

      async function runCampaignAction(button, url, { confirmMessage } = {}) {
        if (confirmMessage) {
          const confirmed = await window.estimuloConfirm(confirmMessage, { confirmLabel: "Cancelar campanha" });
          if (!confirmed) return;
        }

        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = "Aguarde…";

        try {
          await requestJson(url, { method: "POST" });
          await reloadCampaignsList();

          if (state.currentCampaignId) {
            await openCampaignDetail(state.currentCampaignId);
          }
        } catch (error) {
          // Antes o 4xx caia num toast que sumia em 8s levando a mensagem
          // embora; estimuloTratarErro cuida das duas faixas na mesma caixa.
          window.estimuloTratarErro(error);
          button.disabled = false;
          button.textContent = originalText;
        }
      }

      function renderCampaignDetailActions(campaign) {
        const container = document.getElementById("campaignDetailActions");

        if (!campaign) {
          container.innerHTML = "";
          return;
        }

        const buttons = [];

        if (campaign.status === "programado" || campaign.status === "processada") {
          buttons.push(`<button class="btn btn-secondary" type="button" data-campaign-action="pause">Pausar campanha</button>`);
        }

        if (campaign.status === "pausado") {
          buttons.push(`<button class="btn btn-secondary" type="button" data-campaign-action="resume">Retomar campanha</button>`);
        }

        if (["gerando_legendas", "programado", "processada", "pausado"].includes(campaign.status)) {
          buttons.push(`<button class="btn btn-danger" type="button" data-campaign-action="cancel">Cancelar campanha</button>`);
        }

        container.innerHTML = buttons.join("");

        container.querySelectorAll("[data-campaign-action]").forEach((button) => {
          const action = button.dataset.campaignAction;
          button.addEventListener("click", () => {
            const campaignId = state.currentCampaignId;

            if (action === "pause") {
              runCampaignAction(button, `/campaigns/${encodeURIComponent(campaignId)}/pause`);
            } else if (action === "resume") {
              runCampaignAction(button, `/campaigns/${encodeURIComponent(campaignId)}/resume`);
            } else if (action === "cancel") {
              runCampaignAction(button, `/campaigns/${encodeURIComponent(campaignId)}/cancel`, {
                confirmMessage:
                  "Cancelar esta campanha é definitivo: os envios que ainda não saíram não serão mais enviados. Confirmar?",
              });
            }
          });
        });
      }

      async function openCampaignDetail(campaignId) {
        const campaign = state.campaigns.find((c) => c.id === campaignId);
        const isText = isTextCampaign(campaign);
        state.currentCampaignId = campaignId;
        state.captionsByGroup = new Map();
        document.getElementById("campaignDetailTitle").textContent = campaign ? campaignName(campaign) : "Campanha";
        document.getElementById("campaignGroupsVideoHeader").hidden = isText;
        document.getElementById("campaignGroupsBody").innerHTML = `
          <tr><td colspan="4"><div class="empty-state"><strong>Carregando grupos</strong></div></td></tr>`;
        renderCampaignDetailActions(campaign);
        campaignDetailOverlay.hidden = false;
        campaignDetailReleaseTrap = window.estimuloTrapFocus(campaignDetailOverlay);

        try {
          const [groups, progress] = await Promise.all([
            requestJson(`/campaigns/${encodeURIComponent(campaignId)}/groups`),
            isText
              ? Promise.resolve(null)
              : requestJson(`/campaigns/${encodeURIComponent(campaignId)}/captions/progress`).catch(() => null),
          ]);

          if (progress && Array.isArray(progress.items)) {
            progress.items.forEach((item) => {
              state.captionsByGroup.set(`${item.group_id}::${item.video_id}`, item);
            });
          }

          const colspan = isText ? 3 : 4;

          if (!groups.length) {
            document.getElementById("campaignGroupsBody").innerHTML = `
              <tr><td colspan="${colspan}"><div class="empty-state"><strong>Nenhum grupo associado a esta campanha</strong></div></td></tr>`;
            return;
          }

          document.getElementById("campaignGroupsBody").innerHTML = groups
            .map((g) => {
              // "Pausado" nao existe como status de log - e derivado aqui: a
              // campanha esta pausada e este grupo ainda nem chegou a ser
              // processado, entao o disparo dele esta congelado ate o resume.
              const effectiveStatus = campaign && campaign.status === "pausado" && g.status === "pendente"
                ? "pausado"
                : g.status;

              return `
                <tr class="group-row" data-group-id="${escapeHtml(g.group_id)}" data-video-id="${escapeHtml(g.video_id || "")}" aria-label="Ver legenda para ${escapeHtml(g.nome || g.group_id)}">
                  <td class="strong">${escapeHtml(g.nome || g.group_id)}</td>
                  ${isText ? "" : `<td class="mono">${escapeHtml(g.video_id || "—")}</td>`}
                  <td><span class="badge has-tip ${dispatchStatusBadgeClass(effectiveStatus)}" data-tip="${escapeHtml(dispatchStatusTip(effectiveStatus))}" data-tip-tone="${dispatchStatusBadgeClass(effectiveStatus).replace("badge-", "")}">${dispatchStatusLabel(effectiveStatus)}</span></td>
                  <td class="mono">${escapeHtml(g.criado_em || "—")}</td>
                </tr>`;
            })
            .join("");

          document.querySelectorAll("#campaignGroupsBody [data-group-id]").forEach((row) => {
            const activate = () =>
              isText
                ? openGroupMessageText(row.dataset.groupId, row, campaign)
                : openGroupCaption(row.dataset.groupId, row.dataset.videoId, row);
            row.addEventListener("click", activate);
            window.estimuloMakeKeyboardClickable(row, activate);
          });
        } catch (error) {
          document.getElementById("campaignGroupsBody").innerHTML = `
            <tr><td colspan="4"><div class="empty-state"><strong>Falha ao carregar grupos</strong><span>${escapeHtml(window.estimuloErroEmLinha(error))}</span></div></td></tr>`;
        }
      }

      document.getElementById("closeCampaignDetail").addEventListener("click", closeCampaignDetail);
      document.getElementById("closeCampaignDetailFooter").addEventListener("click", closeCampaignDetail);
      campaignDetailOverlay.addEventListener("click", (e) => {
        if (e.target === campaignDetailOverlay) closeCampaignDetail();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !campaignDetailOverlay.hidden) closeCampaignDetail();
      });

      const groupCaptionOverlay = document.getElementById("groupCaptionOverlay");
      let groupCaptionReleaseTrap = null;

      function closeGroupCaption() {
        groupCaptionOverlay.hidden = true;
        if (groupCaptionReleaseTrap) {
          groupCaptionReleaseTrap();
          groupCaptionReleaseTrap = null;
        }
      }

      function openGroupCaption(groupId, videoId, row) {
        const groupName = row.cells[0].textContent;
        const item = state.captionsByGroup.get(`${groupId}::${videoId}`);

        document.getElementById("groupCaptionTitle").textContent = `Legenda · ${groupName}`;

        if (!videoId) {
          document.getElementById("groupCaptionMeta").textContent = "Este grupo ainda não possui um vídeo associado nesta campanha.";
          document.getElementById("groupCaptionContent").innerHTML = "";
          groupCaptionOverlay.hidden = false;
          groupCaptionReleaseTrap = window.estimuloTrapFocus(groupCaptionOverlay);
          return;
        }

        if (!item) {
          document.getElementById("groupCaptionMeta").textContent = "Nenhuma legenda encontrada para este vídeo.";
          document.getElementById("groupCaptionContent").innerHTML = "";
          groupCaptionOverlay.hidden = false;
          groupCaptionReleaseTrap = window.estimuloTrapFocus(groupCaptionOverlay);
          return;
        }

        const videoName = item.video_catalog && item.video_catalog.nome_do_arquivo ? item.video_catalog.nome_do_arquivo : videoId;
        document.getElementById("groupCaptionMeta").textContent = `Vídeo: ${videoName} · ${captionStatusLabel(item.status)}`;

        if (item.status === "gerado" && item.caption_text) {
          document.getElementById("groupCaptionContent").innerHTML = `<p style="white-space: pre-wrap;">${escapeHtml(item.caption_text)}</p>`;
        } else if (item.status === "erro") {
          document.getElementById("groupCaptionContent").innerHTML = `<div class="empty-state"><strong>Erro ao gerar legenda</strong><span>${escapeHtml(item.erro_mensagem || "Tente novamente mais tarde.")}</span></div>`;
        } else {
          document.getElementById("groupCaptionContent").innerHTML = `<div class="empty-state"><strong>Legenda ainda sendo preparada</strong><span>Aguarde a conclusão do processamento.</span></div>`;
        }

        groupCaptionOverlay.hidden = false;
        groupCaptionReleaseTrap = window.estimuloTrapFocus(groupCaptionOverlay);
      }

      function openGroupMessageText(groupId, row, campaign) {
        const groupName = row.cells[0].textContent;

        document.getElementById("groupCaptionTitle").textContent = `Texto da mensagem · ${groupName}`;
        document.getElementById("groupCaptionMeta").textContent = "";

        const texto = campaign && campaign.texto_mensagem;

        if (texto) {
          document.getElementById("groupCaptionContent").innerHTML = `<p style="white-space: pre-wrap;">${escapeHtml(texto)}</p>`;
        } else {
          document.getElementById("groupCaptionContent").innerHTML = `<div class="empty-state"><strong>Nenhum texto registrado</strong><span>Esta campanha não possui um texto de mensagem associado.</span></div>`;
        }

        groupCaptionOverlay.hidden = false;
        groupCaptionReleaseTrap = window.estimuloTrapFocus(groupCaptionOverlay);
      }

      document.getElementById("closeGroupCaptionModal").addEventListener("click", closeGroupCaption);
      document.getElementById("closeGroupCaptionModalFooter").addEventListener("click", closeGroupCaption);
      groupCaptionOverlay.addEventListener("click", (e) => {
        if (e.target === groupCaptionOverlay) closeGroupCaption();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !groupCaptionOverlay.hidden) closeGroupCaption();
      });

      function updateSortToggleButton() {
        const button = document.getElementById("campaignSortToggle");
        const ascending = state.sortDirection !== "desc";
        button.innerHTML = ascending ? "&#8593;" : "&#8595;";
        button.setAttribute("aria-label", `Ordenar por data ${ascending ? "decrescente" : "crescente"}`);
      }

      document.getElementById("campaignSortToggle").addEventListener("click", () => {
        state.sortDirection = state.sortDirection === "desc" ? "asc" : "desc";
        localStorage.setItem("estimulo-campanhas-sort", state.sortDirection);
        updateSortToggleButton();
        renderCampaigns();
      });

      async function initialize() {
        window.estimuloShowLoading();
        try {
          updateSortToggleButton();
          await reloadCampaignsList();
        } finally {
          window.estimuloHideLoading();
        }
      }

      initialize();
    </script>
  </body>
</html>
