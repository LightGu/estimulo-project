<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        try {
          if (localStorage.getItem("estimulo-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <title>Campanhas · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      tr.campaign-row { cursor: pointer; }
      tr.campaign-row:hover { background: var(--surface-strong); }
      tr.group-row { cursor: pointer; }
      tr.group-row:hover { background: var(--surface-strong); }
    </style>
  </head>
  <body data-page="campanhas">
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Campanhas</h1>
            <p>Acompanhamento das campanhas de envio automatizado.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="newCampaignButton" type="button">+ Nova campanha</button>
            <div class="user-chip"><span class="avatar">LC</span> Lina Chaim</div>
          </div>
        </header>

        <main class="page">
          <section class="page-section">
            <div class="section-head"><h2>Campanhas</h2></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Campanha</th>
                    <th>Quantidade de grupos</th>
                    <th>Status</th>
                    <th>Data de disparo</th>
                  </tr>
                </thead>
                <tbody id="campaignsBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="overlay" id="campaignDetailOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3 id="campaignDetailTitle">Campanha</h3>
          <button class="icon-btn-close" id="closeCampaignDetail" type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Grupo</th>
                  <th>Vídeo</th>
                  <th>Status</th>
                  <th>Atualizado em</th>
                </tr>
              </thead>
              <tbody id="campaignGroupsBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="closeCampaignDetailFooter" type="button">Fechar</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="groupCaptionOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3 id="groupCaptionTitle">Legenda do vídeo</h3>
          <button class="icon-btn-close" id="closeGroupCaptionModal" type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <p class="text-muted" id="groupCaptionMeta"></p>
          <div id="groupCaptionContent"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="closeGroupCaptionModalFooter" type="button">Fechar</button>
        </div>
      </div>
    </div>

    <script src="assets/js/nav.js"></script>
    <script src="assets/js/tooltip.js"></script>
    <script>
      const state = {
        campaigns: [],
        currentCampaignId: null,
        captionsByGroup: new Map(),
      };

      function escapeHtml(value) {
        return String(value === null || value === undefined ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || `Falha na requisicao (${response.status})`);
        }

        return payload;
      }

      function campaignName(campaign) {
        return campaign.trilha || campaign.nome || "Campanha";
      }

      function statusLabel(status) {
        return status === "concluido" ? "Concluído" : "Programado";
      }

      function statusBadgeClass(status) {
        return status === "concluido" ? "badge-success" : "badge-info";
      }

      function statusTip(status) {
        if (status === "concluido") return "Todos os grupos já tiveram o envio finalizado (com sucesso ou erro definitivo).";
        return "Aguardando o horário de disparo programado.";
      }

      function dispatchStatusLabel(status) {
        const labels = {
          pendente: "Pendente",
          processando: "Processando",
          enviado: "Enviado",
          erro: "Erro",
          falhou: "Falhou",
        };
        return labels[status] || status || "-";
      }

      function dispatchStatusBadgeClass(status) {
        if (status === "enviado") return "badge-success";
        if (status === "erro" || status === "falhou") return "badge-danger";
        if (status === "processando") return "badge-info";
        return "badge-warning";
      }

      function dispatchStatusTip(status) {
        const tips = {
          pendente: "Ainda não foi processado — aguardando o horário programado de disparo.",
          processando: "Envio em andamento — o vídeo está sendo enviado agora pela Evolution API.",
          enviado: "Entregue com sucesso ao grupo via Evolution API.",
          erro: "Falha no envio. Veja o relatório operacional para mais detalhes.",
          falhou: "Falha no envio. Veja o relatório operacional para mais detalhes.",
        };
        return tips[status] || "";
      }

      function captionStatusLabel(status) {
        const labels = {
          processando: "Gerando legenda…",
          gerado: "Legenda pronta",
          erro: "Erro ao gerar legenda",
        };
        return labels[status] || status || "-";
      }

      function renderCampaigns() {
        if (!state.campaigns.length) {
          document.getElementById("campaignsBody").innerHTML = `
            <tr><td colspan="4"><div class="empty-state"><strong>Nenhuma campanha encontrada</strong><span>As campanhas aparecem aqui assim que um envio automatizado for disparado.</span></div></td></tr>`;
          return;
        }

        document.getElementById("campaignsBody").innerHTML = state.campaigns
          .map(
            (c) => `
              <tr class="campaign-row" data-campaign-id="${escapeHtml(c.id)}">
                <td class="strong">${escapeHtml(campaignName(c))}</td>
                <td>${Number(c.grupos_total || 0)}</td>
                <td><span class="badge has-tip ${statusBadgeClass(c.status)}" data-tip="${escapeHtml(statusTip(c.status))}" data-tip-tone="${statusBadgeClass(c.status).replace("badge-", "")}">${statusLabel(c.status)}</span></td>
                <td class="mono">${escapeHtml(c.data_envio || "—")}</td>
              </tr>`
          )
          .join("");

        document.querySelectorAll("[data-campaign-id]").forEach((row) => {
          row.addEventListener("click", () => openCampaignDetail(row.dataset.campaignId));
        });
      }

      function renderLoadError(error) {
        document.getElementById("campaignsBody").innerHTML = `
          <tr><td colspan="4"><div class="empty-state"><strong>Falha ao carregar campanhas</strong><span>${escapeHtml(error.message)}</span></div></td></tr>`;
      }

      const campaignDetailOverlay = document.getElementById("campaignDetailOverlay");

      function closeCampaignDetail() {
        campaignDetailOverlay.hidden = true;
      }

      async function openCampaignDetail(campaignId) {
        const campaign = state.campaigns.find((c) => c.id === campaignId);
        state.currentCampaignId = campaignId;
        state.captionsByGroup = new Map();
        document.getElementById("campaignDetailTitle").textContent = campaign ? campaignName(campaign) : "Campanha";
        document.getElementById("campaignGroupsBody").innerHTML = `
          <tr><td colspan="4"><div class="empty-state"><strong>Carregando grupos</strong></div></td></tr>`;
        campaignDetailOverlay.hidden = false;

        try {
          const [groups, progress] = await Promise.all([
            requestJson(`/campaigns/${encodeURIComponent(campaignId)}/groups`),
            requestJson(`/campaigns/${encodeURIComponent(campaignId)}/captions/progress`).catch(() => null),
          ]);

          if (progress && Array.isArray(progress.items)) {
            progress.items.forEach((item) => {
              state.captionsByGroup.set(`${item.group_id}::${item.video_id}`, item);
            });
          }

          if (!groups.length) {
            document.getElementById("campaignGroupsBody").innerHTML = `
              <tr><td colspan="4"><div class="empty-state"><strong>Nenhum grupo associado a esta campanha</strong></div></td></tr>`;
            return;
          }

          document.getElementById("campaignGroupsBody").innerHTML = groups
            .map(
              (g) => `
                <tr class="group-row" data-group-id="${escapeHtml(g.group_id)}" data-video-id="${escapeHtml(g.video_id || "")}">
                  <td class="strong">${escapeHtml(g.nome || g.group_id)}</td>
                  <td class="mono">${escapeHtml(g.video_id || "—")}</td>
                  <td><span class="badge has-tip ${dispatchStatusBadgeClass(g.status)}" data-tip="${escapeHtml(dispatchStatusTip(g.status))}" data-tip-tone="${dispatchStatusBadgeClass(g.status).replace("badge-", "")}">${dispatchStatusLabel(g.status)}</span></td>
                  <td class="mono">${escapeHtml(g.criado_em || "—")}</td>
                </tr>`
            )
            .join("");

          document.querySelectorAll("#campaignGroupsBody [data-group-id]").forEach((row) => {
            row.addEventListener("click", () =>
              openGroupCaption(row.dataset.groupId, row.dataset.videoId, row)
            );
          });
        } catch (error) {
          document.getElementById("campaignGroupsBody").innerHTML = `
            <tr><td colspan="4"><div class="empty-state"><strong>Falha ao carregar grupos</strong><span>${escapeHtml(error.message)}</span></div></td></tr>`;
        }
      }

      document.getElementById("closeCampaignDetail").addEventListener("click", closeCampaignDetail);
      document.getElementById("closeCampaignDetailFooter").addEventListener("click", closeCampaignDetail);
      campaignDetailOverlay.addEventListener("click", (e) => {
        if (e.target === campaignDetailOverlay) closeCampaignDetail();
      });

      const groupCaptionOverlay = document.getElementById("groupCaptionOverlay");

      function closeGroupCaption() {
        groupCaptionOverlay.hidden = true;
      }

      function openGroupCaption(groupId, videoId, row) {
        const groupName = row.cells[0].textContent;
        const item = state.captionsByGroup.get(`${groupId}::${videoId}`);

        document.getElementById("groupCaptionTitle").textContent = `Legenda · ${groupName}`;

        if (!videoId) {
          document.getElementById("groupCaptionMeta").textContent = "Este grupo ainda não possui um vídeo associado nesta campanha.";
          document.getElementById("groupCaptionContent").innerHTML = "";
          groupCaptionOverlay.hidden = false;
          return;
        }

        if (!item) {
          document.getElementById("groupCaptionMeta").textContent = "Nenhuma legenda encontrada para este vídeo.";
          document.getElementById("groupCaptionContent").innerHTML = "";
          groupCaptionOverlay.hidden = false;
          return;
        }

        const videoName = item.video_catalog && item.video_catalog.nome_do_arquivo ? item.video_catalog.nome_do_arquivo : videoId;
        document.getElementById("groupCaptionMeta").textContent = `Vídeo: ${videoName} · ${captionStatusLabel(item.status)}`;

        if (item.status === "gerado" && item.caption_text) {
          document.getElementById("groupCaptionContent").innerHTML = `<p style="white-space: pre-wrap;">${escapeHtml(item.caption_text)}</p>`;
        } else if (item.status === "erro") {
          document.getElementById("groupCaptionContent").innerHTML = `<div class="empty-state"><strong>Erro ao gerar legenda</strong><span>${escapeHtml(item.erro_mensagem || "Tente novamente mais tarde.")}</span></div>`;
        } else {
          document.getElementById("groupCaptionContent").innerHTML = `<div class="empty-state"><strong>Legenda ainda sendo preparada</strong><span>Aguarde a conclusão do processamento.</span></div>`;
        }

        groupCaptionOverlay.hidden = false;
      }

      document.getElementById("closeGroupCaptionModal").addEventListener("click", closeGroupCaption);
      document.getElementById("closeGroupCaptionModalFooter").addEventListener("click", closeGroupCaption);
      groupCaptionOverlay.addEventListener("click", (e) => {
        if (e.target === groupCaptionOverlay) closeGroupCaption();
      });

      async function initialize() {
        try {
          const campaigns = await requestJson("/campaigns");
          state.campaigns = Array.isArray(campaigns) ? campaigns : [];
          renderCampaigns();
        } catch (error) {
          renderLoadError(error);
        }
      }

      initialize();
    </script>
  </body>
</html>
