<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trilhas de conteúdo · Estímulo</title>
    <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/img/logo-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
      .trail-card { cursor: pointer; transition: box-shadow 0.15s ease, border-color 0.15s ease; }
      .trail-card:hover { box-shadow: var(--shadow-md); }
      .trail-card.selected { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(78,121,255,0.15); }
      .settings-row { display:flex; align-items:center; gap:12px; }
      .macrotema-path { font-size:12px; color: var(--text-faint); margin-bottom:14px; }
      .trilha-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
      .trilha-tab { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; gap:6px; }
      .trilha-tab:hover { background: var(--surface-strong); }
      .trilha-tab.active { background: var(--brand-blue); border-color: var(--brand-blue); color:#fff; }
      .trilha-tab .count { font-weight:400; opacity:0.85; }
      tr.video-row { cursor: grab; }
      tr.video-row.dragging { opacity: 0.4; }
      tr.video-row.drag-over { box-shadow: inset 0 2px 0 var(--brand-blue); }
      .drag-handle { cursor: grab; color: var(--text-faint); padding-right: 6px; }
      .unclassified-list { max-height: 260px; overflow-y: auto; border:1px solid var(--line); border-radius: var(--radius-md); }
      .unclassified-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:12.5px; }
      .unclassified-item:last-child { border-bottom: 0; }
      .videos-group-title { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-faint); padding:8px 12px 4px; }
      .videos-group-title:not(:first-child) { border-top:1px solid var(--line); margin-top:4px; }
      .icon-btn-edit { border:0; background:transparent; cursor:pointer; color:var(--text-faint); padding:2px 4px; line-height:1; font-size:13px; }
      .icon-btn-edit:hover { color: var(--brand-blue); }
      .trilha-tab-wrap { display:flex; align-items:center; gap:2px; }
      .perfil-checkboxes { display:flex; flex-wrap:wrap; gap:10px; }
      .perfil-checkboxes label { display:flex; align-items:center; gap:6px; font-size:12.5px; }
      .perfis-panel { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0 16px; flex-wrap:wrap; }
      .already-in-trilha { margin-left:auto; font-size:11px; white-space:nowrap; }
    </style>
  </head>
  <body data-page="trilhas">
    <div class="shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1>Trilhas de conteúdo</h1>
            <p>Catálogo de vídeos por perfil de jornada, macrotema e trilha.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="newTrailButton" type="button">+ Nova trilha</button>
            <div class="user-chip"><span class="avatar">GL</span> Gustavo Luz</div>
          </div>
        </header>

        <main class="page">
          <section class="page-section">
            <div class="section-head">
              <h2>Macrotemas por perfil de jornada</h2>
              <div class="segmented" id="perfilTabs">
                <button class="active" data-perfil="todos">Todos</button>
              </div>
            </div>
            <div class="grid grid-cols-3" id="macrotemaGrid"></div>
          </section>

          <section class="page-section" id="trailDetailSection" style="display:none;">
            <div class="section-head">
              <h2 id="macrotemaDetailTitle">Trilhas do macrotema</h2>
              <span class="text-faint" id="trailDetailMeta"></span>
            </div>

            <div class="trilha-tabs" id="trilhaTabs"></div>
            <p class="macrotema-path" id="macrotemaPath"></p>

            <div class="perfis-panel">
              <div class="perfil-checkboxes" id="trailPerfisCheckboxes"></div>
              <button class="btn btn-secondary btn-sm" id="saveTrailPerfisButton" type="button">Salvar perfis</button>
            </div>
            <div id="trailPerfisStatus" class="status-line"></div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Ordem</th>
                    <th>Arquivo</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="videosBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="overlay" id="newTrailOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3>Nova trilha</h3>
          <button class="icon-btn-close" data-close-new type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>Perfis da jornada</label>
            <div class="perfil-checkboxes" id="newTrailPerfil"></div>
          </div>
          <div class="field">
            <label for="newTrailMacrotema">Macrotema</label>
            <select id="newTrailMacrotema"></select>
          </div>
          <div class="field" id="newTrailMacrotemaNovoField" style="display:none;">
            <label for="newTrailMacrotemaNovo">Nome do novo macrotema</label>
            <input id="newTrailMacrotemaNovo" type="text" placeholder="Ex.: GESTÃO FINANCEIRA: Dinheiro Organizado">
          </div>
          <div class="field">
            <label for="newTrailNome">Nome da trilha</label>
            <input id="newTrailNome" type="text" placeholder="Ex.: 2.3 Como Cuidar das Finanças">
          </div>
          <div class="field">
            <label>Vídeos</label>
            <div class="unclassified-list" id="newTrailVideosList"></div>
          </div>
          <div id="newTrailStatus" class="status-line"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close-new type="button">Cancelar</button>
          <button class="btn" id="createTrailButton" type="button">Cadastrar trilha</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="moveOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3>Adicionar vídeo a outra trilha</h3>
          <button class="icon-btn-close" data-close-move type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <p id="moveVideoLabel" class="text-muted"></p>
          <div class="field">
            <label for="moveTargetPerfil">Perfil da jornada</label>
            <select id="moveTargetPerfil"></select>
          </div>
          <div class="field">
            <label for="moveTargetMacrotema">Macrotema</label>
            <select id="moveTargetMacrotema"></select>
          </div>
          <div class="field">
            <label for="moveTargetTrilha">Trilha</label>
            <select id="moveTargetTrilha"></select>
          </div>
          <div id="moveStatus" class="status-line"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close-move type="button">Cancelar</button>
          <button class="btn" id="confirmMoveButton" type="button">Mover vídeo</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="renameOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3 id="renameModalTitle">Editar nome</h3>
          <button class="icon-btn-close" data-close-rename type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="renameNome">Nome</label>
            <input id="renameNome" type="text">
          </div>
          <div id="renameStatus" class="status-line"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close-rename type="button">Cancelar</button>
          <button class="btn" id="confirmRenameButton" type="button">Salvar</button>
        </div>
      </div>
    </div>

    <script src="assets/js/nav.js"></script>
    <script>
      const TRAIL_PROFILES = ["Pré-infância", "Infância", "Adolescência", "Maturidade"];

      const state = {
        trails: [],
        selectableVideos: [],
      };
      const NEW_MACROTEMA_OPTION = "__new_macrotema__";
      let activePerfil = "todos";
      let selectedMacrotemaKey = null;
      let selectedTrilhaKey = null;
      let movingVideo = null;
      let draggingVideoId = null;
      let renameContext = null;

      function escapeHtml(value) {
        return String(value === null || value === undefined ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || `Falha na requisicao (${response.status})`);
        }

        return payload;
      }

      function macrotemaKey(trail) {
        return trail.macrotema;
      }

      function trilhaKey(trail) {
        return trail.id;
      }

      function approvedCount(trail) {
        return trail.videos.filter((v) => v.status === true).length;
      }

      function macrotemasForActivePerfil() {
        const trails = state.trails.filter(
          (t) => activePerfil === "todos" || (t.perfis || []).includes(activePerfil)
        );
        const byKey = new Map();

        trails.forEach((t) => {
          const key = macrotemaKey(t);
          if (!byKey.has(key)) {
            byKey.set(key, {
              macrotema: t.macrotema,
              trails: [],
            });
          }
          byKey.get(key).trails.push(t);
        });

        return Array.from(byKey.values()).sort((left, right) => left.macrotema.localeCompare(right.macrotema));
      }

      function renderPerfilTabs() {
        document.getElementById("perfilTabs").innerHTML = [
          `<button class="${activePerfil === "todos" ? "active" : ""}" data-perfil="todos">Todos</button>`,
          ...TRAIL_PROFILES.map(
            (p) => `<button class="${activePerfil === p ? "active" : ""}" data-perfil="${escapeHtml(p)}">${escapeHtml(p)}</button>`
          ),
        ].join("");
      }

      function renderMacrotemaGrid() {
        const macrotemas = macrotemasForActivePerfil();

        if (!macrotemas.length) {
          document.getElementById("macrotemaGrid").innerHTML =
            '<div class="empty-state"><strong>Nenhum macrotema encontrado</strong></div>';
          return;
        }

        document.getElementById("macrotemaGrid").innerHTML = macrotemas
          .map((m) => {
            const key = macrotemaKey(m);
            const videosCount = m.trails.reduce((sum, t) => sum + t.videos.length, 0);
            const approved = m.trails.reduce((sum, t) => sum + approvedCount(t), 0);
            const perfis = Array.from(new Set(m.trails.flatMap((t) => t.perfis || [])));

            return `
            <div class="card card-pad trail-card${key === selectedMacrotemaKey ? " selected" : ""}" data-macrotema="${escapeHtml(key)}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <strong>${escapeHtml(m.macrotema)}</strong>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span class="badge badge-success">${approved}/${videosCount} aprovado(s)</span>
                  <button class="icon-btn-edit" data-edit-macrotema="${escapeHtml(m.macrotema)}" type="button" title="Editar nome" aria-label="Editar nome do macrotema">✎</button>
                </div>
              </div>
              <p class="text-muted" style="margin-top:6px;font-size:12.5px;">Perfis: ${perfis.length ? escapeHtml(perfis.join(", ")) : '<span class="text-faint">Nenhum</span>'}</p>
              <p class="text-faint" style="margin-top:10px;font-size:12.5px;">${m.trails.length} trilha(s) · ${videosCount} vídeo(s)</p>
            </div>`;
          })
          .join("");

        document.querySelectorAll("[data-edit-macrotema]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            openRenameMacrotema(button.dataset.editMacrotema);
          });
        });

        document.querySelectorAll("[data-macrotema]").forEach((card) => {
          card.addEventListener("click", () => {
            selectedMacrotemaKey = card.dataset.macrotema;
            const macrotema = macrotemas.find((m) => macrotemaKey(m) === selectedMacrotemaKey);
            selectedTrilhaKey = macrotema && macrotema.trails.length ? trilhaKey(macrotema.trails[0]) : null;
            renderMacrotemaGrid();
            renderTrailDetail();
          });
        });
      }

      function currentMacrotema() {
        return macrotemasForActivePerfil().find((m) => macrotemaKey(m) === selectedMacrotemaKey);
      }

      function macrotemasForPerfil(perfil) {
        return Array.from(
          new Set(state.trails.filter((t) => (t.perfis || []).includes(perfil)).map((t) => t.macrotema))
        ).sort();
      }

      function trilhasForPerfilMacrotema(perfil, macrotema, excludeTrilhaId) {
        return state.trails
          .filter(
            (t) =>
              (t.perfis || []).includes(perfil) &&
              t.macrotema === macrotema &&
              t.id !== excludeTrilhaId
          )
          .map((t) => ({ id: t.id, trilha: t.trilha }))
          .sort((left, right) => left.trilha.localeCompare(right.trilha));
      }

      function renderTrailDetail() {
        const macrotema = currentMacrotema();
        const section = document.getElementById("trailDetailSection");

        if (!macrotema) {
          section.style.display = "none";
          return;
        }

        section.style.display = "flex";
        document.getElementById("macrotemaDetailTitle").textContent = macrotema.macrotema;
        const videosCount = macrotema.trails.reduce((sum, t) => sum + t.videos.length, 0);
        const approved = macrotema.trails.reduce((sum, t) => sum + approvedCount(t), 0);
        document.getElementById("trailDetailMeta").textContent = `${macrotema.trails.length} trilha(s) · ${approved} de ${videosCount} vídeo(s) aprovados`;

        document.getElementById("trilhaTabs").innerHTML = macrotema.trails
          .map((t) => {
            const key = trilhaKey(t);
            return `
            <span class="trilha-tab-wrap">
              <button class="trilha-tab${key === selectedTrilhaKey ? " active" : ""}" data-trilha="${escapeHtml(key)}">
                ${escapeHtml(t.trilha)} <span class="count">(${t.videos.length})</span>
              </button>
              <button class="icon-btn-edit" data-edit-trilha="${escapeHtml(key)}" type="button" title="Editar nome" aria-label="Editar nome da trilha">✎</button>
            </span>`;
          })
          .join("");

        document.querySelectorAll("[data-trilha]").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedTrilhaKey = btn.dataset.trilha;
            renderTrailDetail();
          });
        });

        document.querySelectorAll("[data-edit-trilha]").forEach((btn) => {
          btn.addEventListener("click", () => openRenameTrilha(btn.dataset.editTrilha));
        });

        const trail = macrotema.trails.find((t) => trilhaKey(t) === selectedTrilhaKey) || macrotema.trails[0];

        if (!trail) {
          document.getElementById("macrotemaPath").textContent = "";
          document.getElementById("videosBody").innerHTML = `<tr><td colspan="4"><div class="empty-state"><strong>Nenhuma trilha cadastrada</strong></div></td></tr>`;
          return;
        }

        document.getElementById("macrotemaPath").textContent = `${trail.macrotema} · ${trail.trilha}`;
        renderPerfisPanel(trail);

        if (!trail.videos.length) {
          document.getElementById("videosBody").innerHTML = `
            <tr><td colspan="4">
              <div class="empty-state">
                <strong>Nenhum vídeo cadastrado nesta trilha</strong>
              </div>
            </td></tr>`;
          return;
        }

        const sortedVideos = [...trail.videos].sort((left, right) => (left.ordem ?? 0) - (right.ordem ?? 0));

        document.getElementById("videosBody").innerHTML = sortedVideos
          .map(
            (v, index) => `
            <tr class="video-row" draggable="true" data-video-id="${escapeHtml(v.id)}">
              <td><span class="drag-handle">⠿</span>${index + 1}</td>
              <td class="mono">${escapeHtml(v.nome_do_arquivo)}</td>
              <td>${v.status === true ? '<span class="badge badge-success">Aprovado</span>' : '<span class="badge badge-warning">Pendente</span>'}</td>
              <td style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-secondary btn-sm" data-move="${escapeHtml(v.id)}">Adicionar a outra trilha</button>
                <button class="btn btn-secondary btn-sm" data-remove="${escapeHtml(v.id)}">Remover desta trilha</button>
                <button class="btn btn-ghost btn-sm" disabled title="Em breve">Revisar legenda</button>
              </td>
            </tr>`
          )
          .join("");

        document.querySelectorAll("[data-move]").forEach((btn) => btn.addEventListener("click", () => openMove(trail, btn.dataset.move)));
        document.querySelectorAll("[data-remove]").forEach((btn) => btn.addEventListener("click", () => removeVideoFromCurrentTrail(trail, btn.dataset.remove)));
        attachDragAndDrop(trail);
      }

      async function removeVideoFromCurrentTrail(trail, videoId) {
        if (!confirm("Remover este vídeo da trilha atual?")) {
          return;
        }

        try {
          await requestJson(`/trilhas/${encodeURIComponent(trail.id)}/videos/${encodeURIComponent(videoId)}`, {
            method: "DELETE",
          });

          await initialize();
        } catch (error) {
          alert(error.message);
        }
      }

      function renderPerfisPanel(trail) {
        const perfis = trail.perfis || [];

        document.getElementById("trailPerfisCheckboxes").innerHTML = TRAIL_PROFILES.map(
          (perfil) => `
          <label>
            <input type="checkbox" data-trail-perfil value="${escapeHtml(perfil)}" ${perfis.includes(perfil) ? "checked" : ""}>
            ${escapeHtml(perfil)}
          </label>`
        ).join("");

        document.getElementById("trailPerfisStatus").textContent = "";
        document.getElementById("trailPerfisStatus").className = "status-line";

        document.getElementById("saveTrailPerfisButton").onclick = async () => {
          const button = document.getElementById("saveTrailPerfisButton");
          const status = document.getElementById("trailPerfisStatus");
          const selectedPerfis = Array.from(
            document.querySelectorAll("[data-trail-perfil]:checked")
          ).map((input) => input.value);

          if (!selectedPerfis.length) {
            status.textContent = "Selecione ao menos um perfil.";
            status.className = "status-line error";
            return;
          }

          button.disabled = true;
          status.textContent = "Salvando perfis...";
          status.className = "status-line";

          try {
            await requestJson(`/trilhas/${encodeURIComponent(trail.id)}/perfis`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ perfis: selectedPerfis }),
            });

            await initialize();
          } catch (error) {
            status.textContent = error.message;
            status.className = "status-line error";
          } finally {
            button.disabled = false;
          }
        };
      }

      function attachDragAndDrop(trail) {
        const rows = document.querySelectorAll("#videosBody tr.video-row");

        rows.forEach((row) => {
          row.addEventListener("dragstart", () => {
            draggingVideoId = row.dataset.videoId;
            row.classList.add("dragging");
          });

          row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            document.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
          });

          row.addEventListener("dragover", (event) => {
            event.preventDefault();
            row.classList.add("drag-over");
          });

          row.addEventListener("dragleave", () => {
            row.classList.remove("drag-over");
          });

          row.addEventListener("drop", async (event) => {
            event.preventDefault();
            row.classList.remove("drag-over");

            const targetVideoId = row.dataset.videoId;
            if (!draggingVideoId || draggingVideoId === targetVideoId) return;

            const sortedVideos = [...trail.videos].sort((left, right) => (left.ordem ?? 0) - (right.ordem ?? 0));
            const orderedIds = sortedVideos.map((v) => v.id);
            const fromIndex = orderedIds.indexOf(draggingVideoId);
            const toIndex = orderedIds.indexOf(targetVideoId);
            if (fromIndex === -1 || toIndex === -1) return;

            orderedIds.splice(toIndex, 0, orderedIds.splice(fromIndex, 1)[0]);

            try {
              const updatedLinks = await requestJson(`/trilhas/${encodeURIComponent(trail.id)}/reorder`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ordered_video_ids: orderedIds }),
              });

              updatedLinks.forEach((updated) => {
                const video = trail.videos.find((v) => v.id === updated.video_id);
                if (video) video.ordem = updated.ordem;
              });

              renderTrailDetail();
            } catch (error) {
              alert(error.message);
            }

            draggingVideoId = null;
          });
        });
      }

      document.getElementById("perfilTabs").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-perfil]");
        if (!btn) return;
        activePerfil = btn.dataset.perfil;
        selectedMacrotemaKey = null;
        selectedTrilhaKey = null;
        renderPerfilTabs();
        renderMacrotemaGrid();
        renderTrailDetail();
      });

      // Nova trilha
      const newTrailOverlay = document.getElementById("newTrailOverlay");

      function allMacrotemas() {
        return Array.from(new Set(state.trails.map((t) => t.macrotema))).sort();
      }

      function renderNewTrailPerfilCheckboxes() {
        document.getElementById("newTrailPerfil").innerHTML = TRAIL_PROFILES.map(
          (p) => `
          <label>
            <input type="checkbox" data-new-trail-perfil value="${escapeHtml(p)}">
            ${escapeHtml(p)}
          </label>`
        ).join("");
      }

      function renderNewTrailMacrotemaSelect() {
        const select = document.getElementById("newTrailMacrotema");
        const macrotemas = allMacrotemas();

        select.innerHTML = [
          ...macrotemas.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`),
          `<option value="${NEW_MACROTEMA_OPTION}">+ Criar novo macrotema</option>`,
        ].join("");

        toggleNewMacrotemaField();
      }

      function toggleNewMacrotemaField() {
        const isNew = document.getElementById("newTrailMacrotema").value === NEW_MACROTEMA_OPTION;
        document.getElementById("newTrailMacrotemaNovoField").style.display = isNew ? "block" : "none";
      }

      function renderNewTrailVideosList() {
        const list = document.getElementById("newTrailVideosList");

        if (!state.selectableVideos.length) {
          list.innerHTML = '<div class="unclassified-item text-faint">Nenhum vídeo disponível para esta organização.</div>';
          return;
        }

        const newVideos = state.selectableVideos.filter((v) => !(v.trilhas || []).length);
        const classifiedVideos = state.selectableVideos.filter((v) => (v.trilhas || []).length);

        function renderItem(v) {
          const existingTrilhas = (v.trilhas || []).map((t) => t.trilha).join(", ");
          const badge = existingTrilhas
            ? `<span class="text-faint already-in-trilha">Já em: ${escapeHtml(existingTrilhas)}</span>`
            : "";

          return `
            <label class="unclassified-item">
              <input type="checkbox" value="${escapeHtml(v.id)}">
              <span class="mono">${escapeHtml(v.nome_do_arquivo)}</span>
              ${badge}
            </label>`;
        }

        list.innerHTML = [
          `<div class="videos-group-title">Vídeos novos (${newVideos.length})</div>`,
          newVideos.length
            ? newVideos.map(renderItem).join("")
            : '<div class="unclassified-item text-faint">Nenhum vídeo novo encontrado pelo indexador.</div>',
          `<div class="videos-group-title">Já classificados em outras trilhas (${classifiedVideos.length})</div>`,
          classifiedVideos.length
            ? classifiedVideos.map(renderItem).join("")
            : '<div class="unclassified-item text-faint">Nenhum vídeo já classificado.</div>',
        ].join("");
      }

      document.getElementById("newTrailButton").addEventListener("click", async () => {
        renderNewTrailPerfilCheckboxes();
        renderNewTrailMacrotemaSelect();
        document.getElementById("newTrailMacrotemaNovo").value = "";
        document.getElementById("newTrailNome").value = "";
        document.getElementById("newTrailStatus").textContent = "";
        document.getElementById("newTrailStatus").className = "status-line";
        renderNewTrailVideosList();
        newTrailOverlay.hidden = false;

        try {
          state.selectableVideos = await requestJson("/trilhas/selectable-videos");
        } catch (error) {
          state.selectableVideos = [];
        }

        renderNewTrailVideosList();
      });
      document.querySelectorAll("[data-close-new]").forEach((el) => el.addEventListener("click", () => (newTrailOverlay.hidden = true)));
      document.getElementById("newTrailMacrotema").addEventListener("change", toggleNewMacrotemaField);

      document.getElementById("createTrailButton").addEventListener("click", async () => {
        const button = document.getElementById("createTrailButton");
        const status = document.getElementById("newTrailStatus");
        const perfis = Array.from(document.querySelectorAll("[data-new-trail-perfil]:checked")).map(
          (input) => input.value
        );
        const macrotemaSelect = document.getElementById("newTrailMacrotema").value;
        const macrotema =
          macrotemaSelect === NEW_MACROTEMA_OPTION
            ? document.getElementById("newTrailMacrotemaNovo").value.trim()
            : macrotemaSelect;
        const trilha = document.getElementById("newTrailNome").value.trim();
        const video_ids = Array.from(document.querySelectorAll("#newTrailVideosList input[type=checkbox]:checked")).map(
          (input) => input.value
        );

        if (!perfis.length || !macrotema || !trilha || !video_ids.length) {
          status.textContent = "Selecione ao menos um perfil, preencha macrotema, nome da trilha e selecione ao menos um vídeo.";
          status.className = "status-line error";
          return;
        }

        button.disabled = true;
        status.textContent = "Cadastrando trilha...";
        status.className = "status-line";

        try {
          await requestJson("/trilhas", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ perfis, macrotema, trilha, video_ids }),
          });

          newTrailOverlay.hidden = true;
          await initialize();
        } catch (error) {
          status.textContent = error.message;
          status.className = "status-line error";
        } finally {
          button.disabled = false;
        }
      });

      // Adicionar vídeo a outra trilha (endpoint de conveniencia "move")
      const moveOverlay = document.getElementById("moveOverlay");

      function renderMoveMacrotemaSelect(selectedMacrotema) {
        const perfil = document.getElementById("moveTargetPerfil").value;
        const select = document.getElementById("moveTargetMacrotema");
        const macrotemas = macrotemasForPerfil(perfil);

        select.innerHTML = macrotemas.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");

        if (selectedMacrotema && macrotemas.includes(selectedMacrotema)) {
          select.value = selectedMacrotema;
        }

        renderMoveTrilhaSelect();
      }

      function renderMoveTrilhaSelect() {
        const perfil = document.getElementById("moveTargetPerfil").value;
        const macrotema = document.getElementById("moveTargetMacrotema").value;
        const select = document.getElementById("moveTargetTrilha");
        const trilhas = trilhasForPerfilMacrotema(perfil, macrotema, movingVideo ? movingVideo.trilhaId : null);

        select.innerHTML = trilhas.map((t) => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.trilha)}</option>`).join("");
      }

      function openMove(trail, videoId) {
        const video = trail.videos.find((v) => v.id === videoId);
        if (!video) return;

        movingVideo = { trilhaId: trail.id, videoId };
        document.getElementById("moveVideoLabel").textContent = `Vídeo: ${video.nome_do_arquivo}`;

        const perfilSelect = document.getElementById("moveTargetPerfil");
        perfilSelect.innerHTML = TRAIL_PROFILES.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
        perfilSelect.value = (trail.perfis && trail.perfis[0]) || TRAIL_PROFILES[0];

        renderMoveMacrotemaSelect(trail.macrotema);

        document.getElementById("moveStatus").textContent = "";
        document.getElementById("moveStatus").className = "status-line";
        moveOverlay.hidden = false;
      }
      document.querySelectorAll("[data-close-move]").forEach((el) => el.addEventListener("click", () => (moveOverlay.hidden = true)));
      document.getElementById("moveTargetPerfil").addEventListener("change", () => renderMoveMacrotemaSelect());
      document.getElementById("moveTargetMacrotema").addEventListener("change", () => renderMoveTrilhaSelect());

      document.getElementById("confirmMoveButton").addEventListener("click", async () => {
        const button = document.getElementById("confirmMoveButton");
        const status = document.getElementById("moveStatus");
        const toTrilhaId = document.getElementById("moveTargetTrilha").value;

        if (!toTrilhaId) {
          status.textContent = "Selecione a trilha de destino.";
          status.className = "status-line error";
          return;
        }

        button.disabled = true;
        status.textContent = "Adicionando vídeo...";
        status.className = "status-line";

        try {
          await requestJson(`/trilhas/${encodeURIComponent(movingVideo.trilhaId)}/videos/${encodeURIComponent(movingVideo.videoId)}/move`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ to_trilha_id: toTrilhaId }),
          });

          moveOverlay.hidden = true;
          await initialize();
        } catch (error) {
          status.textContent = error.message;
          status.className = "status-line error";
        } finally {
          button.disabled = false;
        }
      });

      function renderLoadError(error) {
        document.getElementById("macrotemaGrid").innerHTML = `
          <div class="empty-state"><strong>Falha ao carregar trilhas</strong><span>${escapeHtml(error.message)}</span></div>`;
      }

      // Editar nome (macrotema/trilha)
      const renameOverlay = document.getElementById("renameOverlay");

      function openRenameMacrotema(macrotema) {
        renameContext = { type: "macrotema", macrotema };
        document.getElementById("renameModalTitle").textContent = "Editar nome do macrotema";
        document.getElementById("renameNome").value = macrotema;
        document.getElementById("renameStatus").textContent = "";
        document.getElementById("renameStatus").className = "status-line";
        renameOverlay.hidden = false;
      }

      function openRenameTrilha(trilhaId) {
        const trail = state.trails.find((t) => t.id === trilhaId);
        if (!trail) return;

        renameContext = { type: "trilha", trilhaId, trilha: trail.trilha };
        document.getElementById("renameModalTitle").textContent = "Editar nome da trilha";
        document.getElementById("renameNome").value = trail.trilha;
        document.getElementById("renameStatus").textContent = "";
        document.getElementById("renameStatus").className = "status-line";
        renameOverlay.hidden = false;
      }

      document.querySelectorAll("[data-close-rename]").forEach((el) =>
        el.addEventListener("click", () => {
          renameOverlay.hidden = true;
          renameContext = null;
        })
      );

      document.getElementById("confirmRenameButton").addEventListener("click", async () => {
        if (!renameContext) return;

        const button = document.getElementById("confirmRenameButton");
        const status = document.getElementById("renameStatus");
        const novoNome = document.getElementById("renameNome").value.trim();

        if (!novoNome) {
          status.textContent = "Informe o novo nome.";
          status.className = "status-line error";
          return;
        }

        button.disabled = true;
        status.textContent = "Salvando...";
        status.className = "status-line";

        try {
          if (renameContext.type === "macrotema") {
            const trailsToUpdate = state.trails.filter((t) => t.macrotema === renameContext.macrotema);

            for (const trail of trailsToUpdate) {
              await requestJson(`/trilhas/${encodeURIComponent(trail.id)}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ macrotema: novoNome }),
              });
            }

            selectedMacrotemaKey = novoNome;
            selectedTrilhaKey = null;
          } else {
            await requestJson(`/trilhas/${encodeURIComponent(renameContext.trilhaId)}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ trilha: novoNome }),
            });
            selectedTrilhaKey = renameContext.trilhaId;
          }

          renameOverlay.hidden = true;
          renameContext = null;
          await initialize();
        } catch (error) {
          status.textContent = error.message;
          status.className = "status-line error";
        } finally {
          button.disabled = false;
        }
      });

      async function initialize() {
        try {
          const trails = await requestJson("/trilhas/overview");
          state.trails = Array.isArray(trails) ? trails : [];

          if (!selectedMacrotemaKey) {
            const macrotemas = macrotemasForActivePerfil();
            selectedMacrotemaKey = macrotemas.length ? macrotemaKey(macrotemas[0]) : null;
            selectedTrilhaKey = macrotemas.length && macrotemas[0].trails.length ? trilhaKey(macrotemas[0].trails[0]) : null;
          }

          renderPerfilTabs();
          renderMacrotemaGrid();
          renderTrailDetail();
        } catch (error) {
          renderLoadError(error);
        }
      }

      initialize();
    </script>
  </body>
</html>
