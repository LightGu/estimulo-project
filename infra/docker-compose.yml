name: estimulo

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped
  init: true
  depends_on:
    redis:
      condition: service_healthy
  environment:
    NODE_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: 6379
    ESTIMULO_SESSION_STATE_FILE: /app/storage/sessions.json
    GOOGLE_DRIVE_VIDEO_INDEX_STATE_FILE: /app/storage/google-drive-video-index-state.json
    # Dentro da rede do compose, "localhost" e' o PROPRIO container - o
    # EVOLUTION_API_URL=http://localhost:8080 do .env (correto para rodar a API
    # fora do Docker, com `npm run api`) fazia a aplicacao tentar falar consigo
    # mesma. Toda chamada a Evolution falhava, e como removeInstance apaga a
    # instancia la ANTES de remover do banco, ate o botao Remover devolvia 500.
    # Aqui o hostname vira o nome do servico; o .env segue valido fora do Docker.
    EVOLUTION_API_URL: ${EVOLUTION_API_URL_INTERNAL:-http://evolution-api:8080}
  volumes:
    - app-storage:/app/storage
    # `credentials/` fica fora da imagem de proposito (esta no .dockerignore),
    # entao o JSON da conta de servico do Google precisa entrar como volume.
    # Sem isto, GOOGLE_DRIVE_CREDENTIALS=./credentials/... resolve para
    # /app/credentials/... , que nao existe dentro do container, e toda chamada
    # ao Drive falha com "Arquivo de credenciais nao encontrado" (indexador de
    # video, testar conexao e reindexar). Read-only: o app so precisa ler.
    - ../credentials:/app/credentials:ro
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - ../.env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *app
    command: ["node", "scripts/start-api.js"]
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Proxy HTTPS opcional: emite/renova certificado Let's Encrypt automaticamente
  # para ESTIMULO_PUBLIC_HOSTNAME (dominio proprio ou um host tipo sslip.io/
  # nip.io que resolve para o IP da VM sem custo) e repassa para a API interna.
  # So funciona com as portas 80 e 443 liberadas na Security List/NSG.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - api
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  campaign-trigger-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-campaign-trigger-worker.js"]

  dispatch-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-dispatch-worker.js"]

  dispatch-review-timeout-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-dispatch-review-timeout-worker.js"]

  dispatch-failure-retry-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-dispatch-failure-retry-worker.js"]

  mensagens-dispatch-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-mensagens-dispatch-worker.js"]

  group-sync-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-group-sync-worker.js"]

  drive-video-index-worker:
    <<: *app
    profiles: ["workers"]
    command: ["node", "scripts/start-google-drive-video-index-worker.js"]

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["evolution"]
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${EVOLUTION_DB_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: ${EVOLUTION_DB_NAME}
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api:latest}
    restart: unless-stopped
    profiles: ["evolution"]
    depends_on:
      redis:
        condition: service_healthy
      evolution-postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/${EVOLUTION_DB_NAME}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_mvp
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LOG_COLOR: "true"
      LOG_BAILEYS: error
      LANGUAGE: pt-BR
    volumes:
      - evolution-instances:/evolution/instances

volumes:
  app-storage:
  redis-data:
  caddy-data:
  caddy-config:
  evolution-postgres-data:
  evolution-instances:
